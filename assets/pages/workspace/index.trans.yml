en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Workspace
  page_icon: ph:bold/sidebar-simple

  intro: "This page is the example: what you are reading stands in the middle of three regions, laid side by side in the body of the page."

  section:
    gap:
      title: The gap is the separator
      description: "Nothing is drawn between two regions. What tells them apart is the room they leave between them, through which the page shows — the same ground the menu and the header stand on. Each region carries its own, which is the ground a body always had."
    each:
      title: Each one on its own
      description: "The two columns keep the width they are given and the middle takes what is left. Scroll one of the three and the other two stay where they are: a region holds its own overflow, and the page holds none."
      more: "A region knows nothing of its neighbours. The explorer on the left is a split of its own — a bar that stays, a tree that scrolls under it — and it would be the same shape anywhere else on the page."

    size:
      title: Sizing one of them
      description: "The region on the left carries a `zone-resizer`: a handle filling the gap beside it, which draws nothing — the cursor says it moves. Drag it, or give it the focus and use the arrows; a double click gives the region back the width the page gave it."
      more: "A handle sizes a region that has a size — one given a width rather than taking what is left — and the flexible one beside it absorbs the difference. The width is remembered under the region's name, so it comes back with the page, here on all three layouts since it is the same region moving."

  editor:
    state: Saved

  inspector:
    title: Details
    field:
      path:
        key: Path
      size:
        key: Size
      changed:
        key: Changed
        value: 3 minutes ago

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'مساحة العمل'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'هذه الصفحة هي المثال: ما تقرأه يقع في وسط ثلاث مناطق، موضوعة جنبًا إلى جنب في جسم الصفحة.'
  section:
    gap:
      title: 'الفجوة هي الفاصل'
      description: 'لا يوجد شيء مرسوم بين منطقتين. ما يميز بينهما هو المساحة التي تتركها بينهما، والتي من خلالها تظهر الصفحة — نفس الأرض التي يقف عليها القائمة والرأس. كل منطقة تحمل خاصيتها، وهي الأرض التي كانت دائمًا موجودة في الجسم.'
    each:
      title: 'كل واحدة بمفردها'
      description: 'تحافظ العمودان على العرض الذي تم إعطاؤه لهما ويأخذ الوسط ما تبقى. قم بالتمرير في واحدة من الثلاثة وستبقى الاثنتين الأخريين في مكانهما: تحتفظ المنطقة بتجاوزها الخاص، والصفحة لا تحتفظ بأي.'
      more: 'لا تعرف المنطقة شيئًا عن جيرانها. المستكشف على اليسار هو قسم خاص بها — شريط يبقى، شجرة تتمرر تحتها — وسيكون بنفس الشكل في أي مكان آخر في الصفحة.'
    size:
      title: 'تغيير حجم أحدها'
      description: 'تحمل المنطقة على اليسار `موسع المنطقة`: مقبض يملأ الفجوة بجانبها، والذي لا يرسم شيئًا — المؤشر يقول إنه يتحرك. اسحبه، أو امنحه التركيز واستخدم الأسهم؛ نقرة مزدوجة تعيد للمنطقة العرض الذي منحته إياها الصفحة.'
      more: 'يغير المقبض حجم منطقة لها حجم — واحدة تم إعطاؤها عرضًا بدلاً من أخذ ما تبقى — ويمتص المرن بجانبها الفرق. يتم تذكر العرض تحت اسم المنطقة، لذا يعود مع الصفحة، هنا في جميع التخطيطات الثلاثة لأنه نفس المنطقة التي تتحرك.'
  editor:
    state: 'تم الحفظ'
  inspector:
    title: التفاصيل
    field:
      path:
        key: المسار
      size:
        key: الحجم
      changed:
        key: 'تم التغيير'
        value: 'منذ ٣ دقائق'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: কর্মক্ষেত্র
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'এই পৃষ্ঠাটি একটি উদাহরণ: আপনি যা পড়ছেন তা তিনটি অঞ্চলের মাঝখানে অবস্থিত, যা পৃষ্ঠার দেহে পাশাপাশি রাখা হয়েছে।'
  section:
    gap:
      title: 'ফাঁক হল বিভাজক'
      description: 'দুই অঞ্চলের মধ্যে কিছুই আঁকা হয়নি। তাদের আলাদা করে যা রয়েছে তা হল তাদের মধ্যে ফাঁকা স্থান, যার মাধ্যমে পৃষ্ঠাটি দেখায় — একই মাটিতে যা মেনু এবং হেডার দাঁড়িয়ে আছে। প্রতিটি অঞ্চল নিজস্ব ধারণ করে, যা হল একটি দেহের সবসময় থাকা মাটি।'
    each:
      title: 'প্রতিটি নিজের মতো'
      description: 'দুইটি কলাম তাদের প্রদত্ত প্রস্থ ধরে রাখে এবং মাঝেরটি যা অবশিষ্ট থাকে তা নেয়। তিনটির মধ্যে একটি স্ক্রোল করুন এবং অন্য দুটি যেখানে আছে সেখানে থাকে: একটি অঞ্চল তার নিজের অতিরিক্ত ধারণ করে, এবং পৃষ্ঠা কোন অতিরিক্ত ধারণ করে না।'
      more: 'একটি অঞ্চল তার প্রতিবেশীদের সম্পর্কে কিছুই জানে না। বামপাশের এক্সপ্লোরার হল তার নিজস্ব একটি বিভাজন — একটি বার যা থাকে, একটি গাছ যা এর নীচে স্ক্রোল করে — এবং এটি পৃষ্ঠার অন্য কোথাও একই আকারের হবে।'
    size:
      title: 'একটিকে আকার দেওয়া'
      description: 'বামপাশের অঞ্চল একটি `zone-resizer` ধারণ করে: একটি হ্যান্ডেল যা এর পাশে ফাঁকা স্থান পূরণ করে, যা কিছুই আঁকে না — কার্সর বলে এটি সরানো যায়। এটি টেনে এনে, বা একে ফোকাস দিয়ে তীরচিহ্ন ব্যবহার করুন; একটি ডাবল ক্লিক অঞ্চলটিকে সেই প্রস্থ ফিরিয়ে দেয় যা পৃষ্ঠা এটিকে দিয়েছে।'
      more: 'একটি হ্যান্ডেল একটি অঞ্চলের আকার দেয় যা একটি আকার ধারণ করে — একটি প্রস্থ দেওয়া হয়েছে বরং যা অবশিষ্ট তা নেওয়া — এবং পাশের নমনীয়টি পার্থক্য শোষণ করে। প্রস্থটি অঞ্চলের নামে মনে রাখা হয়, তাই এটি পৃষ্ঠার সঙ্গে ফিরে আসে, এখানে তিনটি বিন্যাসের মধ্যে যেহেতু এটি একই অঞ্চল চলছে।'
  editor:
    state: সংরক্ষিত
  inspector:
    title: বিস্তারিত
    field:
      path:
        key: পথ
      size:
        key: আকার
      changed:
        key: পরিবর্তিত
        value: '৩ মিনিট আগে'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Arbeitsbereich
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Diese Seite ist das Beispiel: Was Sie lesen, steht in der Mitte von drei Bereichen, die nebeneinander im Seiteninhalt angeordnet sind.'
  section:
    gap:
      title: 'Die Lücke ist der Separator'
      description: 'Nichts wird zwischen zwei Bereichen gezeichnet. Was sie unterscheidet, ist der Platz, den sie zwischen sich lassen, durch den die Seite zeigt — der gleiche Boden, auf dem das Menü und der Header stehen. Jeder Bereich hat seinen eigenen, der der Boden ist, den ein Körper immer hatte.'
    each:
      title: 'Jeder für sich'
      description: 'Die beiden Spalten behalten die Breite, die ihnen gegeben wird, und die Mitte nimmt, was übrig bleibt. Scrollen Sie einen der drei, bleiben die anderen zwei an ihrem Platz: Ein Bereich hat seinen eigenen Überlauf, und die Seite hat keinen.'
      more: 'Ein Bereich weiß nichts von seinen Nachbarn. Der Explorer auf der linken Seite ist eine eigene Teilung — eine Leiste, die bleibt, ein Baum, der darunter scrollt — und er hätte überall auf der Seite die gleiche Form.'
    size:
      title: 'Größe eines von ihnen ändern'
      description: 'Der Bereich auf der linken Seite hat einen `zone-resizer`: einen Griff, der die Lücke neben ihm ausfüllt und nichts zeichnet — der Cursor zeigt an, dass er bewegt wird. Ziehen Sie ihn, oder setzen Sie den Fokus darauf und verwenden Sie die Pfeile; ein Doppelklick gibt dem Bereich die Breite zurück, die die Seite ihm gegeben hat.'
      more: 'Ein Griff ändert die Größe eines Bereichs, der eine Größe hat — einer, der eine Breite zugewiesen bekommt, anstatt das zu nehmen, was übrig bleibt — und der flexible daneben absorbiert den Unterschied. Die Breite wird unter dem Namen des Bereichs gespeichert, sodass sie mit der Seite zurückkommt, hier in allen drei Layouts, da es derselbe Bereich ist, der sich bewegt.'
  editor:
    state: Gespeichert
  inspector:
    title: Details
    field:
      path:
        key: Pfad
      size:
        key: Größe
      changed:
        key: Geändert
        value: 'Vor 3 Minuten'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Espacio de trabajo'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Esta página es el ejemplo: lo que estás leyendo está en el medio de tres regiones, dispuestas lado a lado en el cuerpo de la página.'
  section:
    gap:
      title: 'La brecha es el separador'
      description: 'Nada se dibuja entre dos regiones. Lo que las distingue es el espacio que dejan entre ellas, a través del cual la página muestra — el mismo suelo en el que se encuentra el menú y el encabezado. Cada región tiene la suya, que es el suelo que un cuerpo siempre ha tenido.'
    each:
      title: 'Cada uno por su cuenta'
      description: 'Las dos columnas mantienen el ancho que se les da y la del medio toma lo que queda. Desplaza una de las tres y las otras dos se quedan donde están: una región mantiene su propio desbordamiento, y la página no mantiene ninguno.'
      more: 'Una región no sabe nada de sus vecinas. El explorador a la izquierda es una división propia — una barra que se queda, un árbol que se desplaza debajo de ella — y tendría la misma forma en cualquier otro lugar de la página.'
    size:
      title: 'Dimensionando una de ellas'
      description: 'La región de la izquierda lleva un `zone-resizer`: un mango que llena el espacio a su lado, que no dibuja nada — el cursor indica que se mueve. Arrástralo, o dale el foco y usa las flechas; un doble clic le devuelve a la región el ancho que la página le dio.'
      more: 'Un mango dimensiona una región que tiene un tamaño — uno que se le da un ancho en lugar de tomar lo que queda — y la flexible al lado absorbe la diferencia. El ancho se recuerda bajo el nombre de la región, por lo que vuelve con la página, aquí en los tres diseños ya que es la misma región moviéndose.'
  editor:
    state: Guardado
  inspector:
    title: Detalles
    field:
      path:
        key: Ruta
      size:
        key: Tamaño
      changed:
        key: Cambiado
        value: 'hace 3 minutos'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'فضای کاری'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'این صفحه یک مثال است: آنچه شما می‌خوانید در وسط سه منطقه قرار دارد که در کنار هم در بدنه صفحه چیده شده‌اند.'
  section:
    gap:
      title: 'فاصله جداکننده است'
      description: 'هیچ چیزی بین دو منطقه کشیده نشده است. چیزی که آنها را از هم متمایز می‌کند، فضایی است که بین آنها باقی می‌ماند، فضایی که صفحه نشان می‌دهد — همان زمینی که منو و سرصفحه روی آن قرار دارند. هر منطقه زمین خود را دارد، که همان زمینی است که یک بدنه همیشه داشته است.'
    each:
      title: 'هر کدام به تنهایی'
      description: 'دو ستون عرضی را که به آنها داده شده حفظ می‌کنند و میانه آنچه باقی مانده را می‌گیرد. یکی از این سه را پیمایش کنید و دو تای دیگر در جایی که هستند باقی می‌مانند: یک منطقه Overflow خود را نگه می‌دارد و صفحه هیچ‌کدام را نگه نمی‌دارد.'
      more: 'یک منطقه از همسایگان خود چیزی نمی‌داند. اکتشاف‌گر در سمت چپ یک تقسیم از خود است — یک نوار که باقی می‌ماند، یک درخت که زیر آن پیمایش می‌کند — و این شکل در هر جای دیگر صفحه یکسان خواهد بود.'
    size:
      title: 'تنظیم اندازه یکی از آنها'
      description: 'منطقه سمت چپ یک `zone-resizer` دارد: یک دسته که فضای کناری آن را پر می‌کند و چیزی نمی‌کشد — نشانگر می‌گوید که حرکت می‌کند. آن را بکشید، یا بر روی آن تمرکز کنید و از کلیدها استفاده کنید؛ یک کلیک دوگانه اندازه منطقه را به عرضی که صفحه به آن داد برمی‌گرداند.'
      more: 'یک دسته اندازه یک منطقه را که اندازه‌ای دارد تنظیم می‌کند — یکی که عرضی به آن داده شده به جای اینکه آنچه باقی مانده را بگیرد — و انعطاف‌پذیر کناری آن تفاوت را جذب می‌کند. عرض تحت نام منطقه به یاد می‌ماند، پس با صفحه برمی‌گردد، اینجا در هر سه چیدمان چون همان منطقه در حال حرکت است.'
  editor:
    state: 'ذخیره شده'
  inspector:
    title: جزئیات
    field:
      path:
        key: مسیر
      size:
        key: اندازه
      changed:
        key: 'تغییر یافته'
        value: '3 دقیقه پیش'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Työtila
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Tämä sivu on esimerkki: mitä olet lukemassa, sijaitsee kolmen alueen keskellä, aseteltuna vierekkäin sivun rungossa.'
  section:
    gap:
      title: 'Väli on erotin'
      description: 'Kahden alueen väliin ei piirretä mitään. Ne eroavat toisistaan niiden väliin jättämästä tilasta, jonka läpi sivu näkyy — sama maa, jolla valikko ja otsikko seisovat. Jokaisella alueella on oma, joka on maa, joka ruumiilla aina oli.'
    each:
      title: 'Jokainen omanaan'
      description: 'Kaksi saraketta pitävät antamansa leveyden ja keskimmäinen ottaa sen, mitä jää. Vieritä yhtä kolmesta ja kaksi muuta pysyvät paikoillaan: alue pitää oman ylivuotonsa, eikä sivu pidä mitään.'
      more: 'Alue ei tiedä mitään naapureistaan. Vasemmalla oleva tutkimus on oma jakonsa — palkki, joka pysyy, puu, joka vierittää sen alla — ja se olisi sama muoto missä tahansa muualla sivulla.'
    size:
      title: 'Yhden koon määrittäminen'
      description: 'Vasemmanpuoleinen alue pitää `zone-resizer`:ia: kahva, joka täyttää sen viereisen välin, eikä piirrä mitään — osoitin kertoo sen liikkuvan. Vedä sitä, tai tuo se fokukseen ja käytä nuolia; kaksoisnapsautus palauttaa alueelle takaisin sen leveyden, jonka sivu antoi sille.'
      more: 'Kahva määrittää koon alueelle, joka on kooltaan — yksi, jolle on annettu leveys, eikä se ota sitä, mitä jää — ja sen vieressä oleva joustava alue imee eron. Leveys muistetaan alueen nimessä, joten se palaa sivun mukana, täällä kaikissa kolmessa asettelussa, koska se on sama alue, joka liikkuu.'
  editor:
    state: Tallennettu
  inspector:
    title: Yksityiskohdat
    field:
      path:
        key: Polku
      size:
        key: Koko
      changed:
        key: Muutettu
        value: '3 minuuttia sitten'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Espace de travail'
  page_icon: 'ph:bold/sidebar-simple'
  intro: "Cette page est l'exemple : ce que vous lisez se trouve au milieu de trois régions, disposées côte à côte dans le corps de la page."
  section:
    gap:
      title: "L'écart est le séparateur"
      description: "Rien n'est dessiné entre deux régions. Ce qui les distingue, c'est l'espace qu'elles laissent entre elles, à travers lequel la page se montre — le même sol sur lequel se tiennent le menu et l'en-tête. Chaque région a la sienne, qui est le sol que possède toujours un corps."
    each:
      title: 'Chacune à part'
      description: "Les deux colonnes conservent la largeur qui leur est donnée et le milieu prend ce qui reste. Faites défiler l'une des trois et les deux autres restent là où elles sont : une région gère son propre débordement, et la page n'en gère aucun."
      more: "Une région ne sait rien de ses voisines. L'explorateur à gauche est une séparation à part — une barre qui reste, un arbre qui défile en dessous — et il aurait la même forme n'importe où ailleurs sur la page."
    size:
      title: "Dimensionner l'une d'elles"
      description: "La région à gauche a un `zone-resizer` : une poignée qui remplit l'écart à côté d'elle, qui ne dessine rien — le curseur indique qu'elle se déplace. Faites-la glisser, ou donnez-lui le focus et utilisez les flèches ; un double clic redonne à la région la largeur que la page lui a donnée."
      more: "Une poignée dimensionne une région qui a une taille — une à laquelle on donne une largeur plutôt que de prendre ce qui reste — et celle à côté, flexible, absorbe la différence. La largeur est mémorisée sous le nom de la région, donc elle revient avec la page, ici sur les trois mises en page puisque c'est la même région qui se déplace."
  editor:
    state: Enregistré
  inspector:
    title: Détails
    field:
      path:
        key: Chemin
      size:
        key: Taille
      changed:
        key: Modifié
        value: 'Il y a 3 minutes'

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'מרחב עבודה'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'דף זה הוא הדוגמה: מה שאתה קורא נמצא באמצע שלושה אזורים, מונחים זה לצד זה בגוף הדף.'
  section:
    gap:
      title: 'המרווח הוא המפריד'
      description: 'אין דבר שנמשך בין שני אזורים. מה שמפריד ביניהם הוא המקום שהם משאירים ביניהם, דרכו הדף מציג — אותה קרקע שעליה עומדים התפריט והכותרת. כל אזור נושא את שלו, שהיא הקרקע שתמיד הייתה לגוף.'
    each:
      title: 'כל אחד בפני עצמו'
      description: 'שתי העמודות שומרות על הרוחב שניתן להן והאמצעי לוקח את מה שנשאר. גלול אחד משלושה והאחרים נשארים במקום: אזור מחזיק את ההצפה שלו, והדף לא מחזיק אף אחת.'
      more: 'אזור אינו יודע כלום על שכניו. החוקר בצד שמאל הוא חלוקה משלו — סרגל שנשאר, עץ שגולל מתחתיו — וזה יהיה אותו צורה בכל מקום אחר בדף.'
    size:
      title: 'גודל אחד מהם'
      description: 'האזור בצד שמאל נושא `zone-resizer`: ידית שממלאת את המרווח לצידה, שאינה מושכת דבר — הסמן אומר שזה זז. גרור אותו, או תן לו את הפוקוס והשתמש בחצים; לחיצה כפולה מחזירה לאזור את הרוחב שהדף נתן לו.'
      more: 'ידית מסדרת אזור שיש לו גודל — אחד שניתן רוחב במקום לקחת את מה שנשאר — והגמיש לצידו סופג את ההבדל. הרוחב נזכר תחת שם האזור, כך שהוא חוזר עם הדף, כאן בכל שלושת העיצובים מכיוון שזה אותו אזור זז.'
  editor:
    state: שמור
  inspector:
    title: פרטים
    field:
      path:
        key: נתיב
      size:
        key: גודל
      changed:
