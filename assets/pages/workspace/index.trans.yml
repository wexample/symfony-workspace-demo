        value: 'לפני 3 דקות'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: कार्यक्षेत्र
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'यह पृष्ठ उदाहरण है: जो आप पढ़ रहे हैं वह तीन क्षेत्रों के बीच में है, जो पृष्ठ के शरीर में बगल में रखे गए हैं।'
  section:
    gap:
      title: 'अंतर separator है'
      description: 'दो क्षेत्रों के बीच कुछ नहीं खींचा गया है। उन्हें अलग करने वाली चीज़ वह जगह है जो वे बीच में छोड़ते हैं, जिसके माध्यम से पृष्ठ दिखता है - वही आधार जिस पर मेनू और शीर्षक खड़े हैं। प्रत्येक क्षेत्र में अपना होता है, जो हमेशा एक शरीर का आधार होता है।'
    each:
      title: 'प्रत्येक अपने आप में'
      description: 'दो कॉलम अपनी दी गई चौड़ाई बनाए रखते हैं और बीच वाला बची हुई जगह लेता है। तीन में से एक को स्क्रॉल करें और अन्य दो अपनी जगह पर बने रहते हैं: एक क्षेत्र अपनी ओवरफ्लो को रखता है, और पृष्ठ कोई नहीं रखता।'
      more: 'एक क्षेत्र अपने पड़ोसियों के बारे में कुछ नहीं जानता। बाईं ओर का अन्वेषक अपना खुद का विभाजन है - एक बार जो रहता है, एक पेड़ जो इसके नीचे स्क्रॉल करता है - और यह पृष्ठ पर कहीं और उसी आकार का होगा।'
    size:
      title: 'उनमें से एक का आकार'
      description: 'बाईं ओर का क्षेत्र एक `zone-resizer` ले जाता है: एक हैंडल जो इसके बगल में खाई भरता है, जो कुछ नहीं खींचता - कर्सर कहता है कि यह चलता है। इसे खींचें, या इसे ध्यान में लाएं और तीर का उपयोग करें; एक डबल क्लिक क्षेत्र को वह चौड़ाई वापस देता है जो पृष्ठ ने इसे दी थी।'
      more: 'एक हैंडल एक क्षेत्र का आकार देता है जो एक आकार रखता है - एक जो चौड़ाई दी जाती है बजाय इसके कि जो बचा है उसे ले। और इसके बगल वाला लचीला क्षेत्र अंतर को अवशोषित करता है। चौड़ाई क्षेत्र के नाम के तहत याद रखी जाती है, इसलिए यह पृष्ठ के साथ वापस आती है, यहां तीनों लेआउट में क्योंकि यह वही क्षेत्र है जो चल रहा है।'
  editor:
    state: 'सहेजा गया'
  inspector:
    title: विवरण
    field:
      path:
        key: पाथ
      size:
        key: आकार
      changed:
        key: 'बदला हुआ'
        value: '3 मिनट पहले'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Ruang Kerja'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Halaman ini adalah contoh: apa yang Anda baca berada di tengah tiga wilayah, yang diletakkan berdampingan di badan halaman.'
  section:
    gap:
      title: 'Celah adalah pemisah'
      description: 'Tidak ada yang digambar di antara dua wilayah. Yang membedakan mereka adalah ruang yang mereka tinggalkan di antara keduanya, melalui mana halaman menunjukkan — tanah yang sama tempat menu dan header berada. Setiap wilayah membawa miliknya sendiri, yang merupakan tanah yang selalu dimiliki suatu tubuh.'
    each:
      title: 'Masing-masing berdiri sendiri'
      description: 'Dua kolom mempertahankan lebar yang diberikan dan yang tengah mengambil sisa. Gulir salah satu dari ketiga dan dua lainnya tetap di tempatnya: sebuah wilayah menahan kelebihannya sendiri, dan halaman tidak menahan apa pun.'
      more: 'Sebuah wilayah tidak tahu apa-apa tentang tetangganya. Penjelajah di sebelah kiri adalah pembagian miliknya sendiri — sebuah bilah yang tetap, sebuah pohon yang menggulir di bawahnya — dan itu akan memiliki bentuk yang sama di tempat lain di halaman.'
    size:
      title: 'Mengubah ukuran salah satunya'
      description: 'Wilayah di sebelah kiri membawa `zone-resizer`: sebuah pegangan yang mengisi celah di sampingnya, yang tidak menggambar apa pun — kursor mengatakan itu bergerak. Seret itu, atau beri fokus dan gunakan panah; klik dua kali memberikan wilayah kembali lebar yang diberikan halaman.'
      more: 'Sebuah pegangan mengubah ukuran sebuah wilayah yang memiliki ukuran — yang diberikan lebar daripada mengambil sisa — dan yang fleksibel di sampingnya menyerap perbedaannya. Lebar diingat di bawah nama wilayah, jadi ia kembali dengan halaman, di sini pada ketiga tata letak karena itu adalah wilayah yang sama yang bergerak.'
  editor:
    state: Tersimpan
  inspector:
    title: Detail
    field:
      path:
        key: Jalur
      size:
        key: Ukuran
      changed:
        key: Diubah
        value: '3 menit yang lalu'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Spazio di lavoro'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Questa pagina è un esempio: ciò che stai leggendo si trova al centro di tre aree, disposte affiancate nel corpo della pagina.'
  section:
    gap:
      title: 'Il gap è il separatore'
      description: "Nada è disegnato tra due aree. Ciò che le distingue è lo spazio che lasciano tra di loro, attraverso il quale la pagina mostra — lo stesso terreno su cui si trovano il menu e l'intestazione. Ogni area porta il proprio, che è il terreno che un corpo ha sempre avuto."
    each:
      title: 'Ognuna per conto suo'
      description: "Le due colonne mantengono la larghezza che hanno e il centro prende ciò che resta. Scorri una delle tre e le altre due rimangono dove sono: un'area gestisce il proprio overflow, e la pagina non ne gestisce nessuno."
      more: "Un'area non sa nulla dei suoi vicini. L'esploratore a sinistra è una suddivisione a sé — una barra che rimane, un albero che scorre sotto di essa — e avrebbe la stessa forma in qualsiasi altra parte della pagina."
    size:
      title: 'Dimensionare una di esse'
      description: "L'area a sinistra porta un `zone-resizer`: una maniglia che riempie il gap accanto a essa, che non disegna nulla — il cursore indica che si muove. Trascinala, oppure metti a fuoco e usa le frecce; un doppio clic restituisce all'area la larghezza che la pagina le ha dato."
      more: "Una maniglia dimensiona un'area che ha una dimensione — una data di una larghezza piuttosto che prendere ciò che resta — e quella flessibile accanto assorbe la differenza. La larghezza viene ricordata sotto il nome dell'area, quindi torna con la pagina, qui in tutti e tre i layout poiché è la stessa area a muoversi."
  editor:
    state: Salvato
  inspector:
    title: Dettagli
    field:
      path:
        key: Percorso
      size:
        key: Dimensione
      changed:
        key: Modificato
        value: '3 minuti fa'

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ワークスペース
  page_icon: 'ph:bold/sidebar-simple'
  intro: このページは例です：あなたが読んでいる内容は、ページの本文の中で横に並んでいる三つの領域の真ん中に位置しています。
  section:
    gap:
      title: 隙間は区切りです
      description: '二つの領域の間には何も描かれていません。それらを区別するのは、二つの間に残されたスペースであり、ページはそのスペースを通して示します — メニューとヘッダーが存在する同じ地面です。各領域は自分自身を持ち、体が常に持っていた地面です。'
    each:
      title: それぞれ独自に
      description: 二つの列は与えられた幅を保ち、真ん中は残りのスペースを取ります。三つのうちの一つをスクロールすると、他の二つはそのままの位置に留まります：領域は自分自身のオーバーフローを保持し、ページは何も保持しません。
      more: '領域は隣のことを何も知りません。左側のエクスプローラーは自分自身の分割です — 留まるバーとその下でスクロールするツリー — そしてそれはページの他のどこでも同じ形をしています。'
    size:
      title: 一つのサイズ調整
      description: '左側の領域には `zone-resizer` があり：隙間を埋めるハンドルで、何も描きません — カーソルが動くことを示します。ドラッグするか、フォーカスを当てて矢印を使ってください；ダブルクリックすると、その領域はページが与えた幅を取り戻します。'
      more: 'ハンドルはサイズを持つ領域のサイズを調整します — 幅を与えられたものであり、残りを取るのではなく — そして隣の柔軟なものがその差を吸収します。幅は領域の名前の下に記憶されるので、ページと共に戻り、ここでは三つのレイアウトすべてで同じ領域が移動します。'
  editor:
