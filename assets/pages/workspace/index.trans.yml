ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: '작업 공간'
  page_icon: 'ph:bold/sidebar-simple'
  intro: '이 페이지는 예시입니다: 당신이 읽고 있는 내용은 페이지의 본문에 나란히 배치된 세 개의 영역의 중앙에 위치하고 있습니다.'
  section:
    gap:
      title: '간격은 구분선입니다'
      description: '두 영역 사이에 아무것도 그려지지 않습니다. 그들을 구분짓는 것은 그들 사이에 남기는 여백입니다. 이 여백을 통해 페이지는 메뉴와 헤더가 위치한 동일한 바닥을 보여줍니다. 각 영역은 항상 있었던 그 바닥을 가지고 있습니다.'
    each:
      title: '각각 독립적으로'
      description: '두 개의 열은 주어진 너비를 유지하고 가운데 열은 남은 공간을 차지합니다. 세 개 중 하나를 스크롤하면 나머지 두 개는 제자리에서 유지됩니다: 각 영역은 자체 오버플로우를 가지고 있으며 페이지는 어떤 것도 가지지 않습니다.'
      more: '하나의 영역은 이웃에 대해 아무것도 알지 못합니다. 왼쪽의 탐색기는 그 자체의 분할입니다 — 고정된 바와 그 아래로 스크롤되는 트리 — 그리고 페이지의 다른 곳에서도 같은 형태일 것입니다.'
    size:
      title: '하나의 크기 조정하기'
      description: '왼쪽 영역은 `zone-resizer`를 가지고 있습니다: 옆의 간격을 채우는 핸들이며, 아무것도 그리지 않습니다 — 커서는 움직인다고 말합니다. 드래그하거나 포커스를 주고 화살표를 사용하세요; 더블 클릭하면 페이지가 준 너비를 다시 영역에 돌려줍니다.'
      more: '핸들은 크기가 있는 영역을 크기 조정합니다 — 주어진 너비를 가지며 남은 것을 가져가는 것이 아닙니다 — 옆의 유연한 영역은 차이를 흡수합니다. 너비는 영역의 이름 아래에 기억되므로 페이지와 함께 돌아오며, 세 가지 레이아웃 모두에서 동일한 영역이 이동하기 때문에 여기에서 돌아옵니다.'
  editor:
    state: 저장됨
  inspector:
    title: 세부정보
    field:
      path:
        key: 경로
      size:
        key: 크기
      changed:
        key: 변경됨
        value: '3분 전'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Werkruimte
  page_icon: 'ph:bold/sidebar-simple'
  intro: "Deze pagina is het voorbeeld: wat je leest staat in het midden van drie regio's, naast elkaar in de body van de pagina."
  section:
    gap:
      title: 'De kloof is de scheiding'
      description: "Er is niets getekend tussen twee regio's. Wat ze van elkaar onderscheidt is de ruimte die ze tussen zich laten, waardoor de pagina laat zien — dezelfde grond waarop het menu en de header staan. Elke regio heeft zijn eigen, dat is de grond die een body altijd had."
    each:
      title: 'Iedereen op zijn eigen'
      description: 'De twee kolommen behouden de breedte die ze hebben gekregen en het midden neemt wat overblijft. Scroll één van de drie en de andere twee blijven staan waar ze zijn: een regio houdt zijn eigen overflow, en de pagina houdt er geen.'
      more: 'Een regio weet niets van zijn buren. De verkenner aan de linkerkant is een splitsing op zich — een balk die blijft, een boom die eronder scrollt — en het zou dezelfde vorm hebben waar dan ook op de pagina.'
    size:
      title: 'Een van hen vergroten'
      description: 'De regio aan de linkerkant heeft een `zone-resizer`: een handvat dat de ruimte ernaast opvult, wat niets tekent — de cursor zegt dat het beweegt. Sleep het, of geef het de focus en gebruik de pijlen; een dubbelklik geeft de regio de breedte terug die de pagina gaf.'
      more: 'Een handvat vergroot een regio die een grootte heeft — eentje die een breedte heeft gekregen in plaats van wat overblijft te nemen — en de flexibele ernaast absorbeert het verschil. De breedte wordt onthouden onder de naam van de regio, zodat het terugkomt met de pagina, hier op alle drie de indelingen aangezien het dezelfde regio is die beweegt.'
  editor:
    state: Opgeslagen
  inspector:
    title: Details
    field:
      path:
        key: Pad
      size:
        key: Grootte
      changed:
        key: Gewijzigd
        value: '3 minuten geleden'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Obszar roboczy'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Ta strona jest przykładem: to, co czytasz, znajduje się w środku trzech obszarów, ułożonych obok siebie w treści strony.'
  section:
    gap:
      title: 'Przerwa jest separatorem'
      description: 'Nic nie jest rysowane między dwoma obszarami. To, co je oddziela, to przestrzeń, którą pozostawiają między sobą, przez którą strona się ukazuje — ta sama podstawa, na której stoi menu i nagłówek. Każdy obszar ma swoją własną, która jest podstawą, którą ciało zawsze miało.'
    each:
      title: 'Każdy z osobna'
      description: 'Dwie kolumny zachowują przypisaną im szerokość, a środkowy zajmuje to, co zostało. Przewiń jeden z trzech, a pozostałe dwa pozostaną na swoich miejscach: obszar ma własny nadmiar, a strona nie ma żadnego.'
      more: 'Obszar nie ma pojęcia o swoich sąsiadach. Eksplorator po lewej stronie jest podziałem samym w sobie — pasek, który pozostaje, drzewo, które przewija się pod nim — i w innej części strony miałby ten sam kształt.'
    size:
      title: 'Rozmiar jednego z nich'
      description: 'Obszar po lewej stronie ma `zone-resizer`: uchwyt wypełniający przerwę obok niego, który nic nie rysuje — kursor mówi, że można go przesuwać. Przeciągnij go, lub nadaj mu fokus i użyj strzałek; podwójne kliknięcie przywraca obszarowi szerokość, jaką nadała mu strona.'
      more: 'Uchwyt zmienia rozmiar obszaru, który ma rozmiar — taki, któremu nadano szerokość, zamiast brać to, co zostało — a elastyczny obok niego absorbuje różnicę. Szerokość jest zapamiętywana pod nazwą obszaru, więc wraca z stroną, tutaj we wszystkich trzech układach, ponieważ to ten sam obszar się porusza.'
  editor:
