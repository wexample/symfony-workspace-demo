ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Рабочее пространство'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Эта страница является примером: то, что вы читаете, находится в центре трех областей, расположенных рядом в теле страницы.'
  section:
    gap:
      title: 'Промежуток — это разделитель'
      description: 'Между двумя областями ничего не нарисовано. То, что отличает их, — это пространство, которое они оставляют между собой, через которое страница показывает — тот же фон, на котором стоят меню и заголовок. Каждая область имеет свой собственный фон, который всегда был у тела.'
    each:
      title: 'Каждая по отдельности'
      description: 'Две колонки сохраняют заданную ширину, а средняя занимает оставшееся пространство. Прокручивайте одну из трех, и остальные две остаются на месте: область удерживает свой собственный переполнение, а страница не удерживает никакого.'
      more: 'Область ничего не знает о своих соседях. Исследователь слева — это собственное деление — панель, которая остается, дерево, которое прокручивается под ней — и оно будет иметь такую же форму в любом другом месте на странице.'
    size:
      title: 'Изменение размера одной из них'
      description: 'Область слева имеет `zone-resizer`: ручку, заполняющую промежуток рядом с ней, которая ничего не рисует — курсор говорит, что она двигается. Перетащите её или наведите на неё фокус и используйте стрелки; двойной щелчок возвращает области ширину, которую ей дала страница.'
      more: 'Ручка изменяет размер области, которая имеет размер — ту, которой задана ширина, а не ту, которая занимает оставшееся пространство — и гибкая рядом с ней поглощает разницу. Ширина запоминается под именем области, поэтому она возвращается вместе со страницей, здесь на всех трех макетах, так как это одна и та же область, перемещающаяся.'
  editor:
    state: Сохранено
  inspector:
    title: Детали
    field:
      path:
        key: Путь
      size:
        key: Размер
      changed:
        key: Изменено
        value: '3 минуты назад'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: พื้นที่ทำงาน
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'หน้านี้เป็นตัวอย่าง: สิ่งที่คุณกำลังอ่านอยู่ตรงกลางของสามพื้นที่ ที่อยู่ข้างกันในเนื้อหาของหน้า.'
  section:
    gap:
      title: ช่องว่างคือการแบ่งแยก
      description: 'ไม่มีอะไรถูกวาดระหว่างสองพื้นที่ สิ่งที่บอกความแตกต่างคือพื้นที่ที่พวกเขาทิ้งไว้ระหว่างกัน ซึ่งหน้าจะแสดง — พื้นที่เดียวกันที่เมนูและส่วนหัวอยู่บนพื้นนั้น ทุกพื้นที่มีพื้นของมันเอง ซึ่งเป็นพื้นที่ร่างกายเคยมีเสมอ.'
    each:
      title: แต่ละอันแยกกัน
      description: 'สองคอลัมน์จะรักษาความกว้างที่กำหนดไว้และกลางจะรับสิ่งที่เหลือ เลื่อนหนึ่งในสามและอีกสองจะอยู่ที่เดิม: พื้นที่จะถือการโอเวอร์โฟลว์ของมันเอง และหน้าไม่ถืออะไรเลย.'
      more: 'พื้นที่ไม่รู้จักเพื่อนบ้านของมัน นักสำรวจทางซ้ายคือการแบ่งแยกของมันเอง — แถบที่คงอยู่, ต้นไม้ที่เลื่อนอยู่ใต้ — และจะมีรูปร่างเดียวกันที่ส่วนอื่นของหน้า.'
    size:
      title: ปรับขนาดหนึ่งในนั้น
      description: 'พื้นที่ทางซ้ายมี `zone-resizer`: ที่จับที่เติมช่องว่างข้างๆ ซึ่งไม่วาดอะไร — ตัวชี้จะบอกว่ามันเคลื่อนไหว ลากมัน หรือให้โฟกัสและใช้ลูกศร; คลิกสองครั้งจะทำให้พื้นที่กลับมามีความกว้างที่หน้ามอบให้.'
      more: 'ที่จับปรับขนาดพื้นที่ที่มีขนาด — ขนาดที่กำหนดไว้แทนการรับสิ่งที่เหลือ — และข้างๆ ที่ปรับได้จะดูดซับความแตกต่าง ความกว้างจะถูกจดจำภายใต้ชื่อของพื้นที่ ดังนั้นมันจะกลับมาพร้อมกับหน้า, ที่นี่ในรูปแบบทั้งสามเพราะมันคือพื้นที่เดียวกันที่เคลื่อนที่.'
  editor:
    state: บันทึกแล้ว
  inspector:
    title: รายละเอียด
    field:
      path:
        key: เส้นทาง
      size:
        key: ขนาด
      changed:
        key: เปลี่ยนแปลง
        value: '3 นาทีที่แล้ว'

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Çalışma Alanı'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Bu sayfa örnektir: okuduğunuz içerik, sayfanın ortasında yan yana yer alan üç bölgeden birindedir.'
  section:
    gap:
      title: 'Boşluk ayırıcıdır'
      description: 'İki bölge arasında hiçbir şey çizilmez. Onları ayıran, aralarındaki boşluktur; sayfa bu boşluğun üzerinden gösterir - menünün ve başlığın durduğu aynı zemin. Her bölge kendi zeminine sahiptir, bu da her zaman bir gövdenin sahip olduğu zemindir.'
    each:
      title: 'Her biri kendi başına'
      description: 'İki sütun kendilerine verilen genişliği korur ve ortadaki kalan alanı alır. Üçünden birini kaydırdığınızda, diğer ikisi yerinde kalır: bir bölge kendi taşmasını tutar, sayfa hiçbirini tutmaz.'
      more: 'Bir bölge komşularından habersizdir. Soldaki gezgin, kendi içinde bir bölümdür - kalan bir çubuk, altında kaydırılan bir ağaç - ve sayfanın başka bir yerinde aynı şekle sahip olur.'
    size:
      title: 'Birini boyutlandırma'
      description: 'Soldaki bölge bir `zone-resizer` taşır: yanında boşluğu dolduran bir tutamak, hiçbir şey çizmez - imleç hareket ettiğini söyler. Sürükleyin, veya ona odaklanıp ok tuşlarını kullanın; çift tıklama, bölgeye sayfanın verdiği genişliği geri kazandırır.'
      more: 'Bir tutamak, bir boyutu olan bir bölgeyi boyutlandırır - genişlik verilen, kalan alanı almayan - ve yanındaki esnek olan farkı emmektedir. Genişlik, bölgenin adı altında hatırlanır, bu yüzden sayfa ile birlikte geri döner, burada üç düzenin hepsinde çünkü aynı bölge hareket etmektedir.'
  editor:
    state: Kaydedildi
  inspector:
    title: Ayrıntılar
    field:
      path:
        key: Yol
      size:
        key: Boyut
      changed:
        key: Değiştirildi
        value: '3 dakika önce'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'ورک اسپیس'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'یہ صفحہ ایک مثال ہے: جو آپ پڑھ رہے ہیں وہ تین علاقوں کے درمیان میں ہے، جو صفحے کے جسم میں ایک ساتھ رکھے گئے ہیں۔'
  section:
    gap:
      title: 'فاصلہ علیحدگی کرنے والا ہے'
      description: 'دو علاقوں کے درمیان کچھ نہیں کھینچا گیا ہے۔ انہیں علیحدہ کرنے والی چیز وہ جگہ ہے جو وہ اپنے درمیان چھوڑتے ہیں، جس کے ذریعے صفحہ دکھاتا ہے — وہی سرزمین جس پر مینو اور ہیڈر کھڑے ہیں۔ ہر علاقہ اپنی خاص چیز رکھتا ہے، جو ایک جسم ہمیشہ رکھتا ہے۔'
    each:
      title: 'ہر ایک اپنے طور پر'
      description: 'دو کالم وہ چوڑائی رکھتے ہیں جو انہیں دی گئی ہے اور درمیان وہی لیتا ہے جو باقی بچتا ہے۔ ان تینوں میں سے کسی ایک کو اسکرول کریں اور باقی دو اپنی جگہ پر رہتے ہیں: ایک علاقہ اپنی اضافی جگہ کو سنبھالتا ہے، اور صفحہ کچھ نہیں سنبھالتا۔'
      more: 'ایک علاقہ اپنے ہمسائے کے بارے میں کچھ نہیں جانتا۔ بائیں جانب کا ایکسپلورر اس کا اپنا ایک تقسیم ہے — ایک بار جو رہتا ہے، ایک درخت جو اس کے نیچے اسکرول ہوتا ہے — اور یہ صفحے پر کہیں اور بھی اسی شکل میں ہوگا۔'
    size:
      title: 'ان میں سے ایک کا سائز'
      description: 'بائیں جانب کا علاقہ ایک `zone-resizer` رکھتا ہے: ایک ہینڈل جو اس کے ساتھ والے فاصلہ کو بھرتا ہے، جو کچھ نہیں کھینچتا — کرسر کہتا ہے کہ یہ حرکت کرتا ہے۔ اسے کھینچیں، یا اسے توجہ دیں اور تیروں کا استعمال کریں؛ ڈبل کلک کرنے سے علاقہ وہ چوڑائی واپس لے لیتا ہے جو صفحے نے اسے دی تھی۔'
      more: 'ایک ہینڈل ایک ایسے علاقے کا سائز بناتا ہے جس کا سائز ہوتا ہے — ایک ایسا جو چوڑائی دی گئی ہو بجائے اس کے کہ جو باقی بچتا ہے لے لے — اور اس کے ساتھ والا لچکدار فرق کو جذب کرتا ہے۔ چوڑائی علاقہ کے نام کے نیچے یاد رکھی جاتی ہے، لہذا یہ صفحے کے ساتھ واپس آتا ہے، یہاں تینوں لے آؤٹ میں چونکہ یہ ایک ہی علاقہ ہے جو حرکت کر رہا ہے۔'
  editor:
    state: محفوظ
  inspector:
    title: تفصیلات
    field:
      path:
        key: راستہ
      size:
        key: سائز
      changed:
        key: 'تبدیل شدہ'
        value: '3 منٹ پہلے'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Không gian làm việc'
  page_icon: 'ph:bold/sidebar-simple'
  intro: 'Trang này là ví dụ: những gì bạn đang đọc nằm ở giữa ba vùng, được đặt cạnh nhau trong thân trang.'
  section:
    gap:
      title: 'Khoảng cách là bộ phân cách'
      description: 'Không có gì được vẽ giữa hai vùng. Điều phân biệt chúng là khoảng trống mà chúng để lại giữa chúng, qua đó trang hiển thị — cùng mặt bằng mà menu và tiêu đề đứng trên đó. Mỗi vùng mang theo của riêng nó, đó là mặt đất mà một thân luôn có.'
    each:
      title: 'Mỗi cái tự nó'
      description: 'Hai cột giữ chiều rộng mà chúng được cho và cột giữa lấy những gì còn lại. Cuộn một trong ba cái và hai cái còn lại sẽ giữ nguyên vị trí: một vùng giữ riêng phần tràn của nó, và trang sẽ không giữ gì cả.'
      more: 'Một vùng không biết gì về hàng xóm của nó. Trình khám phá bên trái là một phần tách biệt của riêng nó — một thanh giữ nguyên, một cây cuộn bên dưới nó — và nó sẽ có hình dạng giống nhau ở bất kỳ đâu trên trang.'
    size:
      title: 'Kích thước một trong số đó'
      description: 'Vùng bên trái mang theo một `zone-resizer`: một tay cầm lấp đầy khoảng trống bên cạnh, không vẽ gì — con trỏ cho biết nó có thể di chuyển. Kéo nó, hoặc cho nó được tập trung và sử dụng các mũi tên; một cú nhấp đúp trả lại chiều rộng mà trang đã cho vùng đó.'
      more: 'Một tay cầm điều chỉnh một vùng có kích thước — một vùng được cho chiều rộng thay vì lấy những gì còn lại — và vùng linh hoạt bên cạnh hấp thụ sự khác biệt. Chiều rộng được nhớ dưới tên vùng, vì vậy nó trở lại với trang, ở đây trên cả ba bố cục vì nó là cùng một vùng di chuyển.'
  editor:
    state: 'Đã lưu'
  inspector:
    title: 'Chi tiết'
    field:
      path:
        key: 'Đường dẫn'
      size:
        key: 'Kích thước'
      changed:
        key: 'Đã thay đổi'
        value: '3 phút trước'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 工作区
  page_icon: 'ph:bold/sidebar-simple'
  intro: 此页面是示例：您正在阅读的内容位于三个区域的中间，这些区域并排放置在页面主体中。
  section:
    gap:
      title: 间隙是分隔符
      description: 两个区域之间没有任何内容。区分它们的是它们之间留出的空间，通过这个空间页面展示——与菜单和标题所站立的地方相同。每个区域都有自己的空间，这就是一个主体始终拥有的基础。
    each:
      title: 各自独立
      description: 这两列保持它们被赋予的宽度，中间列占用剩余空间。滚动其中一个，其他两个保持不动：一个区域保持自己的溢出，页面则不保持。
      more: 一个区域对其邻居一无所知。左侧的探索器是它自己的分割——一个保持不变的栏，一个在其下方滚动的树——在页面的其他地方也是相同的形状。
    size:
      title: 调整其中一个的大小
      description: '左侧区域带有一个 `zone-resizer`：一个填充其旁边间隙的手柄，不绘制任何内容——光标指示它可以移动。拖动它，或者聚焦并使用箭头；双击将区域的宽度恢复到页面给予的宽度。'
      more: 一个手柄调整一个有尺寸的区域——一个被赋予宽度而不是占用剩余空间的区域——而旁边的灵活区域吸收差异。宽度在区域名称下被记住，因此与页面一起返回，在所有三种布局中都相同，因为是同一区域在移动。
  editor:
    state: 已保存
  inspector:
    title: 详情
    field:
      path:
        key: 路径
      size:
        key: 大小
      changed:
        key: 已更改
        value: 3分钟前
