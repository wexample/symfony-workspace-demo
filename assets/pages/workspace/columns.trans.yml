en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Five columns
  page_icon: ph:bold/arrows-horizontal

  intro: "Five regions in a row wider than the screen, read by scrolling sideways. The navigation on the left is not one of them — it is a region of the page, and it stays where it is."

  section:
    scroll:
      title: The row scrolls, the page does not
      description: "`zone--split--scroll` puts the overflow on the row: the columns keep the width they name and the split scrolls under them. Each one still holds its own vertical overflow, so a long column scrolls where it stands."
    width:
      title: Every column names its width
      description: "Nothing takes what is left here, since there is none: the row is longer than the page on purpose. A region that names no size falls back to a column wide enough to hold something, and these name theirs — 24rem each, five of them."
    fold:
      title: Folding a region
      description: "Every column here is a `zone-collapsible`. Folded, it does not go away: it keeps its place in the row and its ground, and its bar turns on its side — so the button that folded it is the button that opens it, and nothing outside has to know it exists."
      more: "Named, a region is remembered: the state is written to the ui state under its name and read back when the page is served, so it arrives folded rather than folding under your eyes. The third column opens folded, and the last one is rendered by a vue — same component, same classes, same key."

  column:
    first: Read me
    second: Backlog
    third: In progress
    fourth: Review
    fifth: Done

  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: "What a column holds is none of the row's business: it scrolls on its own, under a bar that stays."

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'خمسة أعمدة'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'خمسة مناطق في صف أوسع من الشاشة، تُقرأ بالتمرير أفقيًا. التنقل على اليسار ليس واحدًا منها - إنه منطقة من الصفحة، ويظل في مكانه.'
  section:
    scroll:
      title: 'الصف يتم التمرير، الصفحة لا'
      description: '`zone--split--scroll` يضع التدفق على الصف: الأعمدة تحتفظ بعرضها المحدد والتقسيم يتم التمرير تحتها. كل واحدة لا تزال تحمل تدفقها العمودي الخاص، لذا العمود الطويل يتم التمرير حيث يقف.'
    width:
      title: 'كل عمود يحدد عرضه'
      description: 'لا شيء يأخذ ما تبقى هنا، لأنه لا يوجد: الصف أطول من الصفحة عن قصد. منطقة لا تحدد حجمًا تعود إلى عمود واسع بما يكفي ليحتوي شيئًا، وهذه تحدد أحجامها - 24rem لكل منها، خمسة منهم.'
    fold:
      title: 'طي منطقة'
      description: 'كل عمود هنا هو `zone-collapsible`. عند طيه، لا يختفي: يحتفظ بمكانه في الصف وأرضه، وشريطه يتحول على جانبه - لذا الزر الذي طواه هو الزر الذي يفتحه، ولا يتعين على أي شيء خارجي أن يعرف بوجوده.'
      more: 'عند التسمية، يتم تذكر المنطقة: الحالة تُكتب إلى حالة واجهة المستخدم تحت اسمها وتُقرأ مرة أخرى عند تقديم الصفحة، لذا تصل مطوية بدلاً من الطي أمام عينيك. العمود الثالث يفتح مطويًا، والعمود الأخير يتم تقديمه بواسطة vue - نفس المكون، نفس الفئات، نفس المفتاح.'
  column:
    first: اقرأني
    second: 'قائمة الانتظار'
    third: 'قيد التنفيذ'
    fourth: مراجعة
    fifth: تم
  card:
    second: تذكرة
    third: تذكرة
    fourth: تذكرة
    fifth: تذكرة
    body: 'ما يحمله العمود ليس من شأن الصف: يتم التمرير بمفرده، تحت شريط يبقى.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'পাঁচটি কলাম'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'পাঁচটি অঞ্চল পর্দার চেয়ে চওড়া, পাশে স্ক্রল করে পড়া হয়। বামের নেভিগেশন এর মধ্যে নয় — এটি পৃষ্ঠার একটি অঞ্চল, এবং এটি নিজের জায়গায় থাকে।'
  section:
    scroll:
      title: 'সারি স্ক্রল হয়, পৃষ্ঠা নয়'
      description: '`zone--split--scroll` সারির উপর ওভারফ্লো রাখে: কলামগুলি তাদের নামকৃত প্রস্থ ধরে রাখে এবং বিভাজন তাদের নিচে স্ক্রল করে। প্রতিটি এখনও তার নিজস্ব উল্লম্ব ওভারফ্লো ধারণ করে, তাই একটি দীর্ঘ কলাম যেখানে দাঁড়িয়ে তা স্ক্রল করে।'
    width:
      title: 'প্রতিটি কলাম তার প্রস্থ বলে'
      description: 'এখানে কিছু নেই যা বাকি নেয়, যেহেতু কিছু নেই: সারিটি উদ্দেশ্যমূলকভাবে পৃষ্ঠার চেয়ে লম্বা। একটি অঞ্চল যা কোনো আকার উল্লেখ করে না, সেটি এমন একটি কলামে ফিরে আসে যা কিছু ধারণ করার জন্য যথেষ্ট চওড়া, এবং এগুলো তাদের নামকরণ করে — প্রতিটি ২৪ রেম, পাঁচটি।'
    fold:
      title: 'একটি অঞ্চলের ভাঁজ'
      description: 'এখানে প্রতিটি কলাম একটি `zone-collapsible`। ভাঁজ করা হলে, এটি চলে যায় না: এটি সারিতে এবং তার স্থানে থাকে, এবং এর বার পাশে ঘোরে — তাই যে বোতামটি এটি ভাঁজ করেছে, সেটিই এটি খুলে, এবং বাইরে কিছু জানার প্রয়োজন নেই যে এটি বিদ্যমান।'
      more: 'নামকৃত হলে, একটি অঞ্চল মনে রাখা হয়: স্থিতি তার নামের অধীনে ui স্থিতে লেখা হয় এবং পৃষ্ঠা পরিবেশন করার সময় আবার পড়া হয়, তাই এটি আপনার চোখের সামনে ভাঁজ হওয়ার পরিবর্তে ভাঁজ করা অবস্থায় আসে। তৃতীয় কলামটি ভাঁজ হয়ে খোলে, এবং শেষটি একটি ভিউ দ্বারা রেন্ডার করা হয় — একই কম্পোনেন্ট, একই ক্লাস, একই চাবি।'
  column:
    first: 'আমাকে পড়ুন'
    second: ব্যাকলগ
    third: চলমান
    fourth: পর্যালোচনা
    fifth: সম্পন্ন
  card:
    second: টিকিট
    third: টিকিট
    fourth: টিকিট
    fifth: টিকিট
    body: 'একটি কলাম যা ধারণ করে তা সারির কাজ নয়: এটি নিজের উপর স্ক্রল করে, একটি বারের নিচে যা স্থির থাকে।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Fünf Spalten'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Fünf Bereiche in einer Reihe, die breiter als der Bildschirm sind und seitlich gescrollt werden. Die Navigation auf der linken Seite gehört nicht dazu – sie ist ein Bereich der Seite und bleibt an ihrem Platz.'
  section:
    scroll:
      title: 'Die Reihe scrollt, die Seite nicht'
      description: '`zone--split--scroll` legt den Überlauf auf die Reihe: die Spalten behalten die Breite, die sie benennen, und der Split scrollt unter ihnen. Jede hat weiterhin ihren eigenen vertikalen Überlauf, sodass eine lange Spalte dort scrollt, wo sie steht.'
    width:
      title: 'Jede Spalte bestimmt ihre Breite'
      description: 'Nichts nimmt, was hier übrig bleibt, da es keines gibt: die Reihe ist absichtlich länger als die Seite. Ein Bereich, der keine Größe angibt, fällt auf eine Spalte zurück, die breit genug ist, um etwas zu halten, und diese geben ihre Breite an – jeweils 24rem, fünf insgesamt.'
    fold:
      title: 'Einen Bereich zusammenfalten'
      description: 'Jede Spalte hier ist ein `zone-collapsible`. Zusammengefaltet verschwindet sie nicht: Sie behält ihren Platz in der Reihe und ihren Boden, und ihre Leiste dreht sich zur Seite – sodass der Knopf, der sie zusammengefaltet hat, der Knopf ist, der sie öffnet, und nichts außerhalb muss wissen, dass sie existiert.'
      more: 'Benannt wird ein Bereich erinnert: Der Zustand wird im UI-Zustand unter seinem Namen gespeichert und beim Laden der Seite wieder gelesen, sodass er gefaltet ankommt, anstatt vor deinen Augen gefaltet zu werden. Die dritte Spalte öffnet gefaltet, und die letzte wird von einer Vue gerendert – dasselbe Component, dieselben Klassen, derselbe Schlüssel.'
  column:
    first: 'Lies mich'
    second: Backlog
    third: 'In Arbeit'
    fourth: Überprüfung
    fifth: Fertig
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: 'Was eine Spalte enthält, geht die Reihe nichts an: sie scrollt für sich allein, unter einer Leiste, die bleibt.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Cinco columnas'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Cinco regiones en fila más anchas que la pantalla, se leen desplazándose hacia los lados. La navegación a la izquierda no es una de ellas: es una región de la página y se queda donde está.'
  section:
    scroll:
      title: 'La fila se desplaza, la página no'
      description: '`zone--split--scroll` pone el desbordamiento en la fila: las columnas mantienen el ancho que nombran y el desbordamiento se desplaza por debajo de ellas. Cada una todavía mantiene su propio desbordamiento vertical, por lo que una columna larga se desplaza donde se encuentra.'
    width:
      title: 'Cada columna nombra su ancho'
      description: 'Nada toma lo que queda aquí, ya que no hay ninguno: la fila es más larga que la página a propósito. Una región que no nombra un tamaño vuelve a una columna lo suficientemente ancha para contener algo, y estas nombran las suyas — 24rem cada una, cinco de ellas.'
    fold:
      title: 'Plegando una región'
      description: 'Cada columna aquí es un `zone-collapsible`. Plegada, no desaparece: mantiene su lugar en la fila y su base, y su barra se gira de lado — así que el botón que la plegó es el botón que la abre, y nada afuera tiene que saber que existe.'
      more: 'Nombrada, una región se recuerda: el estado se escribe en el estado de la interfaz bajo su nombre y se lee de nuevo cuando se sirve la página, así que llega plegada en lugar de plegarse ante tus ojos. La tercera columna se abre plegada, y la última se renderiza por un vue — mismo componente, mismas clases, misma clave.'
  column:
    first: Léeme
    second: Pendiente
    third: 'En progreso'
    fourth: Revisión
    fifth: Hecho
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: 'Lo que una columna contiene no es asunto de la fila: se desplaza por su cuenta, bajo una barra que permanece.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'پنج ستون'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'پنج منطقه در یک ردیف که عریض‌تر از صفحه است و با اسکرول افقی خوانده می‌شود. ناوبری در سمت چپ یکی از آن‌ها نیست — این یک منطقه از صفحه است و در جای خود باقی می‌ماند.'
  section:
    scroll:
      title: 'ردیف اسکرول می‌شود، صفحه نمی‌شود'
      description: '`zone--split--scroll` اضافه بار را بر روی ردیف قرار می‌دهد: ستون‌ها عرضی را که نام می‌برند حفظ می‌کنند و اسکرول تقسیم زیر آن‌ها می‌شود. هر یک هنوز overflow عمودی خود را دارد، بنابراین یک ستون بلند در جایی که ایستاده اسکرول می‌شود.'
    width:
      title: 'هر ستون عرض خود را نام می‌برد'
      description: 'هیچ چیزی آنچه را که اینجا باقی مانده نمی‌گیرد، چون هیچ‌چیزی وجود ندارد: ردیف به عمد از صفحه طولانی‌تر است. یک منطقه که هیچ اندازه‌ای نام نمی‌برد به یک ستونی که به اندازه کافی برای نگه‌داشتن چیزی عریض باشد، بازمی‌گردد و این‌ها عرض خود را نام می‌برند — هر کدام ۲۴rem، پنج تا از آن‌ها.'
    fold:
      title: 'تا کردن یک منطقه'
      description: 'هر ستون در اینجا یک `zone-collapsible` است. وقتی که تا می‌شود، نمی‌رود: در ردیف خود و زمین خود جای خود را حفظ می‌کند و نوار آن به پهلو می‌چرخد — بنابراین دکمه‌ای که آن را تا کرده، دکمه‌ای است که آن را باز می‌کند و هیچ‌چیزی خارج از آن نباید بداند که وجود دارد.'
      more: 'نام‌گذاری شده، یک منطقه به یاد می‌ماند: حالت تحت نام خود به وضعیت رابط کاربری نوشته می‌شود و هنگام ارائه صفحه دوباره خوانده می‌شود، بنابراین به جای اینکه در برابر چشمان شما تا شود، به صورت تا شده می‌رسد. ستون سوم به صورت تا شده باز می‌شود و آخرین ستون توسط یک vue رندر می‌شود — همان کامپوننت، همان کلاس‌ها، همان کلید.'
  column:
    first: 'خواندن من'
    second: 'لیست کارها'
    third: 'در حال انجام'
    fourth: بررسی
    fifth: 'انجام شده'
  card:
    second: تیکت
    third: تیکت
    fourth: تیکت
    fifth: تیکت
    body: 'آنچه یک ستون نگه می‌دارد به ردیف مربوط نیست: آن به تنهایی اسکرول می‌شود، زیر نوار که در جای خود باقی می‌ماند.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Viisi saraketta'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Viisi aluetta rivissä leveämpänä kuin näyttö, luettavissa sivuttain vierittämällä. Vasemmalla oleva navigointi ei ole yksi niistä — se on alue sivusta, ja se pysyy paikallaan.'
  section:
    scroll:
      title: 'Rivi vierittää, sivu ei'
      description: '`zone--split--scroll` asettaa ylivuodon riville: sarakkeet pitävät nimettyä leveyttään ja jakautunut vieritys tapahtuu niiden alla. Jokaisella on edelleen oma pystysuuntainen ylivuotonsa, joten pitkä sarake vierittää paikallaan.'
    width:
      title: 'Jokainen sarake nimeää leveyden'
      description: 'Täällä ei ole mitään, mikä ottaisi sen, mitä on jäljellä: rivi on tarkoituksella pidempi kuin sivu. Alue, joka ei nimeä kokoa, palautuu riittävän leveään sarakkeeseen, ja nämä nimeävät omansa — 24rem kukin, viisi niistä.'
    fold:
      title: 'Alueen taittaminen'
      description: 'Jokainen sarake täällä on `zone-collapsible`. Taitettuna se ei katoa: se pitää paikkansa rivissä ja maaperässään, ja sen palkki kääntyy sivulle — joten nappi, joka taittoi sen, on nappi, joka avaa sen, eikä ulkopuolisten tarvitse tietää sen olemassaolosta.'
      more: 'Nimettynä alue muistetaan: tila kirjoitetaan käyttöliittymän tilaan sen nimen alle ja luetaan takaisin, kun sivu toimitetaan, joten se saapuu taitettuna sen sijaan, että se taittuisi silmiesi edessä. Kolmas sarake avautuu taitettuna, ja viimeinen renderöidään vue:n avulla — sama komponentti, samat luokat, sama avain.'
  column:
    first: 'Lue minua'
    second: Tehtävälista
    third: Käynnissä
    fourth: Arviointi
    fifth: Valmis
  card:
    second: Lippu
    third: Lippu
    fourth: Lippu
    fifth: Lippu
    body: 'Mitä sarake pitää, ei ole rivin asia: se vierittää itsenäisesti, palkin alla, joka pysyy.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Cinq colonnes'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: "Cinq régions en ligne plus larges que l'écran, à lire en défilant horizontalement. La navigation à gauche n'en fait pas partie — c'est une région de la page, et elle reste à sa place."
  section:
    scroll:
      title: 'La ligne défile, la page ne le fait pas'
      description: "`zone--split--scroll` met le débordement sur la ligne : les colonnes gardent la largeur qu'elles nomment et le défilement se fait en dessous. Chacune conserve son propre débordement vertical, donc une longue colonne défile là où elle se trouve."
    width:
      title: 'Chaque colonne nomme sa largeur'
      description: "Rien ne prend ce qui reste ici, puisqu'il n'y en a pas : la ligne est plus longue que la page intentionnellement. Une région qui ne nomme pas de taille revient à une colonne suffisamment large pour contenir quelque chose, et celles-ci nomment la leur — 24rem chacune, cinq au total."
    fold:
      title: 'Plier une région'
      description: "Chaque colonne ici est une `zone-collapsible`. Pliée, elle ne disparaît pas : elle garde sa place dans la ligne et son sol, et sa barre se tourne sur le côté — donc le bouton qui l'a pliée est le bouton qui l'ouvre, et rien à l'extérieur n'a besoin de savoir qu'elle existe."
      more: "Nommée, une région est retenue : l'état est écrit dans l'état de l'ui sous son nom et relu lorsque la page est servie, donc elle arrive pliée plutôt que de se plier sous vos yeux. La troisième colonne s'ouvre pliée, et la dernière est rendue par un vue — même composant, mêmes classes, même clé."
  column:
    first: Lis-moi
    second: Arriéré
    third: 'En cours'
    fourth: Révision
    fifth: Fait
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: "Ce qu'une colonne contient ne regarde pas la ligne : elle défile toute seule, sous une barre qui reste."

he:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'חמש עמודות'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'חמש אזורים בשורה רחבים יותר מהמסך, נקראים על ידי גלילה לצדדים. הניווט בצד שמאל אינו אחד מהם — הוא אזור של הדף, והוא נשאר במקומו.'
  section:
    scroll:
      title: 'השורה גוללת, הדף לא'
      description: '`zone--split--scroll` שם את העודף על השורה: העמודות שומרות על הרוחב שהן קובעות והחלוקה גוללת מתחתן. כל אחת עדיין מחזיקה את העודף האנכי שלה, כך שעמודה ארוכה גוללת במקום שהיא נמצאת.'
    width:
      title: 'כל עמודה קובעת את הרוחב שלה'
      description: 'שום דבר לא לוקח את מה שנשאר כאן, מכיוון שאין: השורה ארוכה יותר מהדף בכוונה. אזור שאינו קובע גודל חוזר לעמודה רחבה מספיק כדי להכיל משהו, והעמודות הללו קובעות את רוחבן — 24rem כל אחת, חמישה מהם.'
    fold:
      title: 'קיפול אזור'
      description: 'כל עמודה כאן היא `zone-collapsible`. כשהיא מקופלת, היא לא נעלמת: היא שומרת על מקומה בשורה ועל הקרקע שלה, והבר שלה מתהפך על צדדיו — כך שהכפתור שקיפל אותה הוא הכפתור שמפתח אותה, ושום דבר מחוץ לא צריך לדעת שהיא קיימת.'
      more: 'אזור עם שם נזכר: המצב נכתב למצב ה-ui תחת שמו ונקרא חזרה כשמגישים את הדף, כך שהוא מגיע מקופל במקום לקפל מול עיניך. העמודה השלישית נפתחת מקופלת, והאחרונה מוכללת על ידי vue — אותו רכיב, אותם מחלקות, אותו מפתח.'
  column:
    first: 'קרא לי'
    second: 'רשימת המתנה'
    third: בתהליך
    fourth: סקירה
    fifth: הושלם
  card:
    second: כרטיס
    third: כרטיס
    fourth: כרטיס
    fifth: כרטיס
    body: 'מה שעומדת עמודה לא עניין השורה: היא גוללת בעצמה, מתחת לבר שנשאר.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'पाँच कॉलम'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'पाँच क्षेत्र एक पंक्ति में स्क्रीन से चौड़े होते हैं, जिन्हें बाईं ओर स्क्रॉल करके पढ़ा जाता है। बाईं ओर की नेविगेशन उनमें से नहीं है - यह पृष्ठ का एक क्षेत्र है, और यह अपनी जगह पर रहता है।'
  section:
    scroll:
      title: 'पंक्ति स्क्रॉल होती है, पृष्ठ नहीं'
      description: '`zone--split--scroll` पंक्ति पर ओवरफ़्लो डालता है: कॉलम अपनी नामित चौड़ाई रखते हैं और विभाजन उनके नीचे स्क्रॉल होता है। प्रत्येक में अभी भी अपनी लंबवत ओवरफ़्लो होती है, इसलिए एक लंबा कॉलम वहीं स्क्रॉल होता है जहाँ वह खड़ा है।'
    width:
      title: 'हर कॉलम अपनी चौड़ाई बताता है'
      description: 'यहाँ कुछ भी नहीं है जो बाकी लेता है, क्योंकि यहाँ कुछ नहीं है: पंक्ति जानबूझकर पृष्ठ से लंबी है। एक क्षेत्र जो आकार नहीं बताता, एक कॉलम में वापस गिरता है जो कुछ रखने के लिए पर्याप्त चौड़ा होता है, और ये अपनी चौड़ाई बताते हैं - प्रत्येक 24rem, उनमें से पाँच।'
    fold:
      title: 'एक क्षेत्र को मोड़ना'
      description: 'यहाँ हर कॉलम एक `zone-collapsible` है। मोड़े जाने पर, यह नहीं जाता: यह पंक्ति में अपनी जगह और जमीन बनाए रखता है, और इसकी पट्टी अपनी ओर मुड़ जाती है - इसलिए बटन जो इसे मोड़ता है वही बटन है जो इसे खोलता है, और बाहर कुछ भी जानने की जरूरत नहीं है कि यह मौजूद है।'
      more: 'नामित होने पर, एक क्षेत्र याद रखा जाता है: स्थिति इसे नाम के तहत ui स्थिति में लिखी जाती है और जब पृष्ठ परोसता है तो वापस पढ़ी जाती है, इसलिए यह आपकी आंखों के सामने मोड़ने के बजाय मोड़ा हुआ आता है। तीसरा कॉलम मोड़ा हुआ खुलता है, और अंतिम एक vue द्वारा प्रस्तुत किया जाता है - वही घटक, वही वर्ग, वही कुंजी।'
  column:
    first: 'मुझे पढ़ें'
    second: बैकलॉग
    third: 'प्रगति में'
    fourth: समीक्षा
    fifth: 'पूरा हुआ'
  card:
    second: टिकट
    third: टिकट
    fourth: टिकट
    fifth: टिकट
    body: 'एक कॉलम में जो कुछ है वह पंक्ति का मामला नहीं है: यह स्वयं स्क्रॉल होता है, एक पट्टी के नीचे जो रहती है।'

id:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Lima kolom'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Lima wilayah dalam satu baris yang lebih lebar dari layar, dibaca dengan menggulir ke samping. Navigasi di sebelah kiri bukanlah salah satunya — itu adalah wilayah halaman, dan tetap di tempatnya.'
  section:
    scroll:
      title: 'Baris menggulir, halaman tidak'
      description: '`zone--split--scroll` menempatkan overflow pada baris: kolom menjaga lebar yang mereka sebut dan pemisahan menggulir di bawahnya. Masing-masing tetap memegang overflow vertikalnya sendiri, jadi kolom yang panjang menggulir di tempatnya.'
    width:
      title: 'Setiap kolom menyebut lebar yang dimilikinya'
      description: 'Tidak ada yang mengambil sisa di sini, karena tidak ada: baris lebih panjang dari halaman dengan sengaja. Wilayah yang tidak menyebutkan ukuran akan kembali ke kolom yang cukup lebar untuk menampung sesuatu, dan kolom ini menyebutkan ukuran mereka — 24rem masing-masing, lima di antaranya.'
    fold:
      title: 'Melipat sebuah wilayah'
      description: 'Setiap kolom di sini adalah `zone-collapsible`. Dilipat, itu tidak menghilang: ia menjaga tempatnya di baris dan posisinya, dan batangnya berputar ke samping — jadi tombol yang melipatnya adalah tombol yang membukanya, dan tidak ada yang di luar harus tahu bahwa itu ada.'
      more: 'Dengan nama, sebuah wilayah diingat: keadaan ditulis ke status UI di bawah namanya dan dibaca kembali saat halaman disajikan, sehingga tiba dalam keadaan dilipat alih-alih melipat di depan mata Anda. Kolom ketiga terbuka dalam keadaan dilipat, dan yang terakhir dirender oleh vue — komponen yang sama, kelas yang sama, kunci yang sama.'
  column:
    first: 'Baca saya'
    second: 'Daftar tunggu'
    third: 'Sedang berlangsung'
    fourth: Tinjau
    fifth: Selesai
  card:
    second: Tiket
    third: Tiket
    fourth: Tiket
    fifth: Tiket
    body: 'Apa yang dipegang oleh kolom bukan urusan baris: itu menggulir sendiri, di bawah batang yang tetap.'

it:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Cinque colonne'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Cinque regioni in fila più larghe dello schermo, leggibili scorrendo lateralmente. La navigazione a sinistra non ne fa parte: è una regione della pagina e rimane al suo posto.'
  section:
    scroll:
      title: 'La fila scorre, la pagina no'
      description: "`zone--split--scroll` mette l'overflow sulla fila: le colonne mantengono la larghezza che dichiarano e la divisione scorre sotto di esse. Ognuna mantiene ancora il proprio overflow verticale, quindi una colonna lunga scorre dove si trova."
    width:
      title: 'Ogni colonna dichiara la sua larghezza'
      description: "Niente occupa ciò che rimane qui, poiché non ce n'è: la fila è più lunga della pagina di proposito. Una regione che non dichiara dimensioni torna a una colonna sufficientemente larga per contenere qualcosa, e queste dichiarano le loro — 24rem ciascuna, cinque in totale."
    fold:
      title: 'Piegare una regione'
      description: "Ogni colonna qui è un `zone-collapsible`. Piegata, non scompare: mantiene il suo posto nella fila e il suo spazio, e la sua barra si gira di lato — quindi il pulsante che l'ha piegata è anche il pulsante che la riapre, e nulla al di fuori deve sapere che esiste."
      more: "Chiamata, una regione viene ricordata: lo stato è scritto nello stato dell'interfaccia sotto il suo nome e letto quando la pagina viene servita, quindi arriva piegata anziché piegarsi sotto i tuoi occhi. La terza colonna si apre piegata, e l'ultima è renderizzata da un vue — stesso componente, stesse classi, stessa chiave."
  column:
    first: Leggimi
    second: Backlog
    third: 'In corso'
    fourth: Revisione
    fifth: Fatto
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: 'Ciò che una colonna contiene non è affare della fila: scorre da sola, sotto una barra che rimane.'

ja:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 五つのカラム
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 画面よりも広い五つの領域が横に並んでおり、横にスクロールして読むことができます。左側のナビゲーションはその一部ではなく、ページの領域であり、その位置は変わりません。
  section:
    scroll:
      title: 行はスクロールし、ページはスクロールしない
      description: '`zone--split--scroll`は行にオーバーフローを追加します：カラムはそれぞれ指定した幅を保ち、分割部分はその下でスクロールします。それぞれのカラムは自分自身の垂直オーバーフローを持っているため、長いカラムはその場所でスクロールします。'
    width:
      title: 各カラムは自分の幅を指定する
      description: 'ここには余裕がないため、残りを取るものはありません：行は意図的にページよりも長くなっています。サイズを指定しない領域は、何かを保持するのに十分な幅のカラムに戻り、これらはそれぞれの幅を指定します — 各24rem、合計五つです。'
    fold:
      title: 領域を折りたたむ
      description: 'ここにあるすべてのカラムは`zone-collapsible`です。折りたたまれた状態でも消えず、行の中でその位置と基盤を保ち、バーは横に回転します — そのため、折りたたむボタンが開くボタンとなり、外部はそれが存在することを知る必要はありません。'
      more: '名前が付けられた領域は記憶されます：状態はその名前の下にUI状態に書き込まれ、ページが提供されるときに再び読み取られ、目の前で折りたたまれるのではなく折りたたまれた状態で届きます。第三のカラムは折りたたまれた状態で開き、最後のカラムはVueによって描画されます — 同じコンポーネント、同じクラス、同じキーです。'
  column:
    first: 読んでください
    second: バックログ
    third: 進行中
    fourth: レビュー
    fifth: 完了
  card:
    second: チケット
    third: チケット
    fourth: チケット
    fifth: チケット
    body: カラムが保持する内容は行の問題ではありません：それは自分自身でスクロールし、バーの下で留まります。

ko:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: '다섯 개의 열'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: '화면보다 넓은 다섯 개의 영역이 가로로 배열되어 있으며, 옆으로 스크롤하여 읽습니다. 왼쪽의 내비게이션은 그 중 하나가 아닙니다 — 페이지의 영역이며, 그 자리에 그대로 있습니다.'
  section:
    scroll:
      title: '행은 스크롤되고, 페이지는 스크롤되지 않습니다'
      description: '`zone--split--scroll`은 행에 오버플로우를 적용합니다: 열은 자신이 설정한 너비를 유지하고, 분할은 그 아래에서 스크롤됩니다. 각 열은 여전히 자신의 수직 오버플로우를 가지고 있으므로, 긴 열은 그 자리에 있던 곳에서 스크롤됩니다.'
    width:
      title: '모든 열은 자신의 너비를 설정합니다'
      description: '여기에는 남는 것이 없습니다: 행이 페이지보다 길도록 의도된 것입니다. 크기를 지정하지 않은 영역은 무언가를 담을 수 있을 만큼 넓은 열로 돌아가며, 이들은 각각 자신의 너비를 설정합니다 — 각 24rem, 총 다섯 개입니다.'
    fold:
      title: '영역 접기'
      description: '여기 있는 모든 열은 `zone-collapsible`입니다. 접히면 사라지지 않고: 행에서 자신의 위치와 기초를 유지하며, 바는 옆으로 돌아갑니다 — 따라서 접는 버튼이 여는 버튼이 되고, 외부에서는 그것이 존재하는지 알 필요가 없습니다.'
      more: '이름이 있는 영역은 기억됩니다: 상태는 해당 이름 아래 UI 상태에 기록되고, 페이지가 제공될 때 다시 읽혀지므로, 눈앞에서 접히기보다는 접힌 상태로 도착합니다. 세 번째 열은 접힌 상태로 열리고, 마지막 열은 vue로 렌더링됩니다 — 같은 컴포넌트, 같은 클래스, 같은 키입니다.'
  column:
    first: 읽어보세요
    second: 백로그
    third: '진행 중'
    fourth: 검토
    fifth: 완료
  card:
    second: 티켓
    third: 티켓
    fourth: 티켓
    fifth: 티켓
    body: '열이 담고 있는 것은 행의 일이 아닙니다: 스스로 스크롤되며, 바 아래에서 유지됩니다.'

nl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Vijf kolommen'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: "Vijf regio's in een rij die breder zijn dan het scherm, te lezen door zijwaarts te scrollen. De navigatie aan de linkerkant is daar niet één van — het is een regio van de pagina, en het blijft op zijn plaats."
  section:
    scroll:
      title: 'De rij scrollt, de pagina niet'
      description: '`zone--split--scroll` plaatst de overflow op de rij: de kolommen behouden de breedte die ze benoemen en de split scrollt eronder. Elke kolom heeft nog steeds zijn eigen verticale overflow, dus een lange kolom scrollt waar hij staat.'
    width:
      title: 'Elke kolom benoemt zijn breedte'
      description: 'Er is hier niets dat de resterende ruimte in beslag neemt, aangezien die er niet is: de rij is opzettelijk langer dan de pagina. Een regio die geen grootte benoemt, valt terug op een kolom die breed genoeg is om iets te bevatten, en deze benoemen hun breedte — elk 24rem, vijf in totaal.'
    fold:
      title: 'Een regio opvouwen'
      description: 'Elke kolom hier is een `zone-collapsible`. Opgevouwen gaat hij niet weg: hij behoudt zijn plaats in de rij en zijn grond, en zijn balk draait op zijn zij — dus de knop die hem opvouwde, is de knop die hem opent, en niets buiten hoeft te weten dat hij bestaat.'
      more: 'Benoemd, wordt een regio onthouden: de staat wordt geschreven naar de ui-status onder zijn naam en weer gelezen wanneer de pagina wordt geladen, zodat hij opgevouwen arriveert in plaats van onder uw ogen op te vouwen. De derde kolom opent opgevouwen, en de laatste wordt weergegeven door een vue — dezelfde component, dezelfde klassen, dezelfde sleutel.'
  column:
    first: 'Lees mij'
    second: Backlog
    third: 'In uitvoering'
    fourth: Review
    fifth: Klaar
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: 'Wat een kolom bevat, is niet de zorg van de rij: het scrollt zelfstandig, onder een balk die blijft.'

pl:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Pięć kolumn'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Pięć obszarów w jednym rzędzie, szerszych niż ekran, przeglądanych przez przewijanie w poziomie. Nawigacja po lewej stronie nie jest jednym z nich — to obszar strony, który pozostaje na swoim miejscu.'
  section:
    scroll:
      title: 'Rząd przewija się, strona nie'
      description: '`zone--split--scroll` umieszcza nadmiar w rzędzie: kolumny zachowują szerokość, którą zadeklarowały, a przewijanie pod nimi. Każda z nich wciąż ma własny pionowy nadmiar, więc długa kolumna przewija się tam, gdzie stoi.'
    width:
      title: 'Każda kolumna określa swoją szerokość'
      description: 'Nic nie zajmuje tego, co tutaj zostało, ponieważ nic nie ma: rząd jest celowo dłuższy niż strona. Obszar, który nie określa rozmiaru, wraca do kolumny szerokiej na tyle, by coś pomieścić, a te określają swoje — po 24rem każda, pięć z nich.'
    fold:
      title: 'Złożenie obszaru'
      description: 'Każda kolumna tutaj to `zone-collapsible`. Złożona, nie znika: zachowuje swoje miejsce w rzędzie i swoją przestrzeń, a jej pasek obraca się na bok — więc przycisk, który ją złożył, jest przyciskiem, który ją otwiera, a nic na zewnątrz nie musi wiedzieć, że istnieje.'
      more: 'Nazwana, przestrzeń jest zapamiętywana: stan jest zapisywany w stanie ui pod swoją nazwą i odczytywany, gdy strona jest serwowana, więc przychodzi złożona zamiast składać się przed twoimi oczami. Trzecia kolumna otwiera się złożona, a ostatnia jest renderowana przez vue — ten sam komponent, te same klasy, ten sam klucz.'
  column:
    first: 'Przeczytaj mnie'
    second: Zaległości
    third: 'W trakcie'
    fourth: Przegląd
    fifth: Zrobione
  card:
    second: Zgłoszenie
    third: Zgłoszenie
    fourth: Zgłoszenie
    fifth: Zgłoszenie
    body: 'To, co trzyma kolumna, nie jest sprawą rzędu: przewija się samo, pod paskiem, który pozostaje.'

pt_BR:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Cinco colunas'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Cinco regiões em linha mais largas que a tela, lidas rolando para o lado. A navegação à esquerda não é uma delas — é uma região da página, e fica onde está.'
  section:
    scroll:
      title: 'A linha rola, a página não'
      description: '`zone--split--scroll` coloca o transbordo na linha: as colunas mantêm a largura que nomeiam e o transbordo rola abaixo delas. Cada uma ainda mantém seu próprio transbordo vertical, então uma coluna longa rola onde está.'
    width:
      title: 'Cada coluna define sua largura'
      description: 'Nada ocupa o que sobrou aqui, já que não há: a linha é mais longa que a página de propósito. Uma região que não define um tamanho recua para uma coluna larga o suficiente para conter algo, e essas definem as suas — 24rem cada, cinco delas.'
    fold:
      title: 'Dobrar uma região'
      description: 'Cada coluna aqui é um `zone-collapsible`. Dobrada, não desaparece: mantém seu lugar na linha e seu espaço, e sua barra se vira de lado — então o botão que a dobrou é o botão que a abre, e nada do lado de fora precisa saber que ela existe.'
      more: 'Nomeada, uma região é lembrada: o estado é escrito no estado da ui sob seu nome e lido de volta quando a página é servida, então ela chega dobrada em vez de dobrar aos seus olhos. A terceira coluna abre dobrada, e a última é renderizada por um vue — mesmo componente, mesmas classes, mesma chave.'
  column:
    first: Leia-me
    second: Backlog
    third: 'Em progresso'
    fourth: Revisão
    fifth: Concluído
  card:
    second: Ticket
    third: Ticket
    fourth: Ticket
    fifth: Ticket
    body: 'O que uma coluna contém não é da conta da linha: ela rola sozinha, sob uma barra que permanece.'

ru:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Пять колонок'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Пять областей в ряд шире экрана, читаются прокруткой вбок. Навигация слева не входит в их число — это область страницы, и она остается на месте.'
  section:
    scroll:
      title: 'Ряд прокручивается, страница — нет'
      description: '`zone--split--scroll` помещает переполнение в ряд: колонки сохраняют свою заданную ширину, а раздел прокручивается под ними. Каждая из них все еще имеет собственное вертикальное переполнение, поэтому длинная колонка прокручивается там, где она стоит.'
    width:
      title: 'Каждая колонка задает свою ширину'
      description: 'Ничто не занимает оставшееся здесь пространство, поскольку его нет: ряд шире страницы намеренно. Область, которая не задает размер, отступает к колонке, широкой достаточно для чего-то, и они задают свои размеры — по 24rem каждая, всего пять.'
    fold:
      title: 'Свертывание области'
      description: 'Каждая колонка здесь является `zone-collapsible`. В свернутом состоянии она не исчезает: сохраняет свое место в ряду и свою основу, а ее панель поворачивается на бок — так что кнопка, которая ее свернула, является кнопкой, которая ее открывает, и ничто внешнее не должно знать о ее существовании.'
      more: 'Названная область запоминается: состояние записывается в состояние интерфейса под ее именем и считывается обратно, когда страница загружается, так что она приходит свернутой, а не свертывается у вас на глазах. Третья колонка открывается свернутой, а последняя отображается с помощью vue — один и тот же компонент, одни и те же классы, один и тот же ключ.'
  column:
    first: 'Прочитай меня'
    second: Бэклог
    third: 'В процессе'
    fourth: 'На проверке'
    fifth: Сделано
  card:
    second: Заявка
    third: Заявка
    fourth: Заявка
    fifth: Заявка
    body: 'То, что содержит колонка, не касается ряда: она прокручивается сама, под панелью, которая остается.'

th:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ห้าคอลัมน์
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'ห้าพื้นที่เรียงกันในแถวที่กว้างกว่าหน้าจอ สามารถอ่านได้โดยการเลื่อนข้าง การนำทางทางซ้ายไม่ใช่หนึ่งในนั้น — มันเป็นพื้นที่ของหน้า และมันจะอยู่ที่เดิม'
  section:
    scroll:
      title: 'แถวเลื่อน หน้าไม่เลื่อน'
      description: '`zone--split--scroll` ทำให้การล้นอยู่ในแถว: คอลัมน์จะคงความกว้างตามที่ตั้งชื่อไว้และการเลื่อนจะแบ่งอยู่ใต้พวกมัน ทุกคอลัมน์ยังคงมีการล้นในแนวตั้งของตนเอง ดังนั้นคอลัมน์ยาวจะเลื่อนอยู่ที่ที่มันตั้งอยู่'
    width:
      title: ทุกคอลัมน์ตั้งชื่อความกว้างของมัน
      description: 'ไม่มีอะไรใช้สิ่งที่เหลืออยู่ที่นี่ เนื่องจากไม่มี: แถวยาวกว่าหน้าโดยตั้งใจ พื้นที่ที่ไม่มีการตั้งขนาดจะกลับไปที่คอลัมน์ที่กว้างพอที่จะรองรับบางอย่าง และแต่ละคอลัมน์ตั้งชื่อความกว้างของตนเอง — 24rem ต่อคอลัมน์ ทั้งหมดห้าคอลัมน์'
    fold:
      title: พับพื้นที่
      description: 'ทุกคอลัมน์ที่นี่เป็น `zone-collapsible` เมื่อพับแล้ว มันจะไม่หายไป: มันจะรักษาตำแหน่งในแถวและพื้นที่ของมัน และแท่งของมันจะหมุนไปทางด้านข้าง — ดังนั้นปุ่มที่พับมันคือปุ่มที่เปิดมัน และไม่มีอะไรภายนอกต้องรู้ว่ามันมีอยู่'
      more: 'ชื่อพื้นที่จะถูกจดจำ: สถานะจะถูกเขียนลงในสถานะ UI ใต้ชื่อของมันและอ่านกลับเมื่อหน้าแสดงผล ดังนั้นมันจะมาถึงในสภาพพับแทนที่จะพับต่อหน้าคุณ คอลัมน์ที่สามเปิดในสภาพพับ และคอลัมน์สุดท้ายถูกเรนเดอร์โดย vue — คอมโพเนนต์เดียวกัน คลาสเดียวกัน คีย์เดียวกัน'
  column:
    first: อ่านฉัน
    second: รายการที่รอ
    third: กำลังดำเนินการ
    fourth: ตรวจสอบ
    fifth: เสร็จสิ้น
  card:
    second: ตั๋ว
    third: ตั๋ว
    fourth: ตั๋ว
    fifth: ตั๋ว
    body: 'สิ่งที่คอลัมน์ถืออยู่นั้นไม่ใช่เรื่องของแถว: มันเลื่อนตามลำพัง ใต้แท่งที่อยู่เฉยๆ'

tr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Beş sütun'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Ekrandan daha geniş beş bölge, yatay kaydırarak okunur. Soldaki navigasyon bunlardan biri değildir — bu sayfanın bir bölgesidir ve yerinde kalır.'
  section:
    scroll:
      title: 'Satır kayar, sayfa kaymaz'
      description: '`zone--split--scroll` taşmayı satıra koyar: sütunlar adladıkları genişliği korur ve bölme onların altında kayar. Her biri hala kendi dikey taşmasını tutar, bu yüzden uzun bir sütun, bulunduğu yerde kayar.'
    width:
      title: 'Her sütun genişliğini adlandırır'
      description: 'Burada kalan hiçbir şey yok, çünkü maksatla satır sayfadan daha uzundur. Boyut belirtmeyen bir bölge, bir şey tutacak kadar geniş bir sütuna geri döner ve bunlar kendi boyutlarını belirtir — her biri 24rem, beş tane.'
    fold:
      title: 'Bir bölgeyi katlama'
      description: 'Buradaki her sütun bir `zone-collapsible`dır. Katlandığında, kaybolmaz: satırdaki yerini ve zeminini korur ve çubuğu yanına döner — bu yüzden katlayan düğme, açan düğmedir ve dışarıda kimsenin var olduğunu bilmesine gerek yoktur.'
      more: 'Adlandırıldığında, bir bölge hatırlanır: durum, adı altında arayüz durumuna yazılır ve sayfa sunulduğunda geri okunur, bu yüzden gözlerinizin önünde katlanmak yerine katlanmış olarak gelir. Üçüncü sütun katlanmış olarak açılır ve sonuncusu bir vue ile render edilir — aynı bileşen, aynı sınıflar, aynı anahtar.'
  column:
    first: 'Beni oku'
    second: 'Bekleme listesi'
    third: 'Devam ediyor'
    fourth: 'Gözden geçir'
    fifth: Tamamlandı
  card:
    second: Bilet
    third: Bilet
    fourth: Bilet
    fifth: Bilet
    body: 'Bir sütunun tuttuğu, satırın işi değildir: kendi başına kayar, yerinde kalan bir çubuğun altında.'

ur:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'پانچ کالم'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'پانچ علاقے ایک صف میں ہیں جو اسکرین سے وسیع ہیں، جو سائیڈ میں سکرول کرکے پڑھے جاتے ہیں۔ بائیں جانب نیویگیشن ان میں سے ایک نہیں ہے — یہ صفحے کا ایک علاقہ ہے، اور یہ اپنی جگہ پر رہتا ہے۔'
  section:
    scroll:
      title: 'صف سکرول ہوتا ہے، صفحہ نہیں'
      description: '`zone--split--scroll` صف پر اوورفلو رکھتا ہے: کالم اپنے نام کی چوڑائی برقرار رکھتے ہیں اور تقسیم ان کے نیچے سکرول کرتی ہے۔ ہر ایک اب بھی اپنی اپنی عمودی اوورفلو رکھتا ہے، لہذا ایک طویل کالم جہاں ہے وہاں سکرول ہوتا ہے۔'
    width:
      title: 'ہر کالم اپنی چوڑائی کا نام دیتا ہے'
      description: 'یہاں کچھ بھی نہیں لیا جاتا، کیونکہ یہاں کوئی نہیں ہے: صف جان بوجھ کر صفحے سے لمبی ہے۔ ایک علاقہ جو کوئی سائز نامزد نہیں کرتا، اتنا چوڑا ہو جاتا ہے کہ کچھ رکھ سکے، اور یہ اپنے سائز کا نام دیتے ہیں — ہر ایک 24rem، پانچ ہیں۔'
    fold:
      title: 'ایک علاقے کو فولڈ کرنا'
      description: 'یہاں ہر کالم ایک `zone-collapsible` ہے۔ فولڈ ہونے پر، یہ غائب نہیں ہوتا: یہ صف میں اپنی جگہ اور اپنی بنیاد برقرار رکھتا ہے، اور اس کا بار اپنی طرف مڑ جاتا ہے — لہذا جو بٹن اسے فولڈ کرتا ہے وہی بٹن اسے کھولتا ہے، اور باہر کچھ بھی جاننے کی ضرورت نہیں کہ یہ موجود ہے۔'
      more: 'نامزد، ایک علاقہ یاد رکھا جاتا ہے: حالت اس کے نام کے تحت ui حالت میں لکھی جاتی ہے اور جب صفحہ فراہم کیا جاتا ہے تو واپس پڑھی جاتی ہے، لہذا یہ آپ کی آنکھوں کے سامنے فولڈ ہونے کے بجائے فولڈ ہو کر آتا ہے۔ تیسرا کالم فولڈ کھلتا ہے، اور آخری ایک vue کے ذریعے رینڈر ہوتا ہے — وہی جزو، وہی کلاسیں، وہی کلید۔'
  column:
    first: 'مجھے پڑھیں'
    second: 'بیک لاگ'
    third: 'جاری ہے'
    fourth: جائزہ
    fifth: 'ہو گیا'
  card:
    second: ٹکٹ
    third: ٹکٹ
    fourth: ٹکٹ
    fifth: ٹکٹ
    body: 'ایک کالم میں کیا ہے، یہ صف کا معاملہ نہیں ہے: یہ اپنے طور پر سکرول کرتا ہے، ایک بار کے نیچے جو برقرار رہتا ہے۔'

vi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Năm cột'
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 'Năm khu vực nằm cạnh nhau rộng hơn màn hình, đọc bằng cách cuộn ngang. Điều hướng bên trái không phải là một trong số đó - nó là một khu vực của trang, và nó giữ nguyên vị trí của nó.'
  section:
    scroll:
      title: 'Dòng cuộn, trang không cuộn'
      description: '`zone--split--scroll` đặt phần tràn trên dòng: các cột giữ chiều rộng mà chúng chỉ định và phần tràn cuộn bên dưới chúng. Mỗi cột vẫn giữ phần tràn dọc riêng của nó, vì vậy một cột dài cuộn ở vị trí của nó.'
    width:
      title: 'Mỗi cột chỉ định chiều rộng của nó'
      description: 'Không có gì chiếm không gian còn lại ở đây, vì không có: dòng dài hơn trang một cách cố ý. Một khu vực không chỉ định kích thước sẽ quay lại một cột đủ rộng để chứa thứ gì đó, và những cột này chỉ định chiều rộng của chúng - mỗi cột 24rem, tổng cộng năm cột.'
    fold:
      title: 'Gập một khu vực'
      description: 'Mỗi cột ở đây là một `zone-collapsible`. Khi gập lại, nó không biến mất: nó giữ vị trí trong dòng và mặt đất của nó, và thanh của nó quay sang một bên - vì vậy nút gập nó cũng là nút mở nó, và không có gì bên ngoài cần biết nó tồn tại.'
      more: 'Khi được đặt tên, một khu vực được ghi nhớ: trạng thái được ghi vào trạng thái ui dưới tên của nó và được đọc lại khi trang được phục vụ, vì vậy nó đến dưới dạng gập lại thay vì gập trước mắt bạn. Cột thứ ba mở ra dưới dạng gập lại, và cột cuối cùng được render bởi một vue - cùng thành phần, cùng lớp, cùng khóa.'
  column:
    first: 'Đọc tôi'
    second: 'Danh sách chờ'
    third: 'Đang tiến hành'
    fourth: 'Xem xét'
    fifth: 'Hoàn thành'
  card:
    second: Phiếu
    third: Phiếu
    fourth: Phiếu
    fifth: Phiếu
    body: 'Những gì một cột chứa không phải là việc của dòng: nó cuộn độc lập, dưới một thanh giữ nguyên.'

zh:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 五列
  page_icon: 'ph:bold/arrows-horizontal'
  intro: 五个区域横排，宽于屏幕，通过横向滚动阅读。左侧的导航不是其中之一——它是页面的一个区域，保持原位。
  section:
    scroll:
      title: 行滚动，页面不滚动
      description: '`zone--split--scroll` 将溢出放在行上：列保持它们命名的宽度，分割在它们下面滚动。每个列仍然保持自己的垂直溢出，所以长列在原地滚动。'
    width:
      title: 每列命名其宽度
      description: 这里没有其他东西占用剩余空间，因为故意让行比页面长。一个没有指定大小的区域退回到足够宽以容纳内容的列，而这些列各自命名——每个24rem，共五个。
    fold:
      title: 折叠区域
      description: '这里的每一列都是一个 `zone-collapsible`。折叠后，它并不会消失：它保持在行中的位置和基础，且其条形横放——所以折叠它的按钮就是打开它的按钮，外部无需知道它的存在。'
      more: 命名的区域被记住：状态被写入以其名称命名的用户界面状态中，并在页面服务时读回，因此它到达时是折叠的，而不是在你眼前折叠。第三列以折叠状态打开，最后一列由vue渲染——相同的组件，相同的类，相同的键。
  column:
    first: 读我
    second: 待办事项
    third: 进行中
    fourth: 审查
    fifth: 完成
  card:
    second: 票据
    third: 票据
    fourth: 票据
    fifth: 票据
    body: 一列所持内容与行无关：它自行滚动，下面有一个保持不动的条形。
