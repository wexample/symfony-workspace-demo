en:
  page_title: Slide
  page_icon: ph:bold/presentation
  position: '%position% / %count%'
  slide:
    cover:
      title: Cover
      body: A deck of four slides, to show a workspace and not a presentation.
    agenda:
      title: Agenda
      body: The rail chooses, the centre shows, the inspector says which one and moves on.
    figures:
      title: Figures
      body: This slide was rendered by the server and loaded into an embed.
    closing:
      title: Closing
      body: Three regions, one channel, and none of them knows the others.

fr:
  page_title: Diapositive
  page_icon: ph:bold/presentation
  position: '%position% / %count%'
  slide:
    cover:
      title: Couverture
      body: Un jeu de quatre diapositives, pour montrer un espace de travail et non une présentation.
    agenda:
      title: Programme
      body: Le rail choisit, le centre montre, l'inspecteur dit laquelle et passe à la suivante.
    figures:
      title: Chiffres
      body: Cette diapositive a été rendue par le serveur et chargée dans un embed.
    closing:
      title: Conclusion
      body: Trois régions, un canal, et aucune ne connaît les autres.

zh:
  page_title: 幻灯片
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: 封面
      body: 一组四张幻灯片，用于展示工作区而不是演示文稿。
    agenda:
      title: 议程
      body: 轨道选择，中心展示，检查员决定哪个并继续。
    figures:
      title: 数字
      body: 此幻灯片由服务器渲染并加载到嵌入中。
    closing:
      title: 结束
      body: 三个区域，一个通道，彼此之间没有了解。

ar:
  page_title: شريحة
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: الغلاف
      body: 'مجموعة من أربع شرائح، لعرض مساحة العمل وليس عرض تقديمي.'
    agenda:
      title: 'جدول الأعمال'
      body: 'المسار يختار، المركز يظهر، المفتش يحدد أي واحدة ويتقدم.'
    figures:
      title: الأرقام
      body: 'تم عرض هذه الشريحة بواسطة الخادم وتحميلها في تضمين.'
    closing:
      title: الإغلاق
      body: 'ثلاثة مجالات، قناة واحدة، ولا أحد منهم يعرف الآخرين.'

hi:
  page_title: स्लाइड
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: कवर
      body: 'चार स्लाइडों का एक डेक, जो एक कार्यक्षेत्र दिखाता है और न कि एक प्रस्तुति।'
    agenda:
      title: एजेंडा
      body: 'रेल चुनती है, केंद्र दिखाता है, निरीक्षक बताता है कि कौन सा और आगे बढ़ता है।'
    figures:
      title: आकृतियाँ
      body: 'इस स्लाइड को सर्वर द्वारा प्रस्तुत किया गया था और एक एम्बेड में लोड किया गया था।'
    closing:
      title: समापन
      body: 'तीन क्षेत्र, एक चैनल, और इनमें से कोई भी दूसरों को नहीं जानता।'

he:
  page_title: שקף
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: כריכה
      body: 'ערכה של ארבעה שקפים, להציג מקום עבודה ולא מצגת.'
    agenda:
      title: 'סדר יום'
      body: 'הרכבת בוחרת, המרכז מציג, המפקח קובע איזה ואחר כך עובר.'
    figures:
      title: דמויות
      body: 'שקף זה הוצג על ידי השרת וטען לתוך הטמעה.'
    closing:
      title: סיום
      body: 'שלושה אזורים, ערוץ אחד, ואף אחד מהם לא מכיר את האחרים.'

fa:
  page_title: اسلاید
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: کاور
      body: 'یک دسته چهار اسلاید، برای نشان دادن یک محیط کاری و نه یک ارائه.'
    agenda:
      title: 'دستور جلسه'
      body: 'ریل انتخاب می کند، مرکز نشان می دهد، بازرس می گوید کدام یک و ادامه می دهد.'
    figures:
      title: اعداد
      body: 'این اسلاید توسط سرور رندر شده و در یک کد جاسازی شده بارگذاری شده است.'
    closing:
      title: خاتمه
      body: 'سه منطقه، یک کانال، و هیچکدام از آن‌ها از دیگری خبر ندارد.'

ur:
  page_title: سلائیڈ
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: کور
      body: 'چار سلائیڈز کا ڈیک، جو ایک ورک اسپیس کو دکھاتا ہے اور پریزنٹیشن نہیں۔'
    agenda:
      title: ایجنڈا
      body: 'ریل چنتی ہے، مرکز دکھاتا ہے، انسپکٹر کہتا ہے کہ کون سا اور آگے بڑھتا ہے۔'
    figures:
      title: 'اعداد و شمار'
      body: 'یہ سلائیڈ سرور کے ذریعے تیار کی گئی تھی اور ایک ایمبیڈ میں لوڈ کی گئی تھی۔'
    closing:
      title: اختتام
      body: 'تین علاقے، ایک چینل، اور ان میں سے کوئی بھی دوسرے کو نہیں جانتا۔'

ja:
  page_title: スライド
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: カバー
      body: ワークスペースを示す4枚のスライドのデッキであり、プレゼンテーションではありません。
    agenda:
      title: アジェンダ
      body: レールが選び、センターが示し、インスペクターがどれかを言って進みます。
    figures:
      title: 図表
      body: このスライドはサーバーによってレンダリングされ、埋め込まれました。
    closing:
      title: 締めくくり
      body: 3つの領域、1つのチャネル、そしてそれぞれが他を知りません。

ko:
  page_title: 슬라이드
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: 표지
      body: '작업 공간을 보여주고 프레젠테이션이 아닌 네 장의 슬라이드로 구성된 덱입니다.'
    agenda:
      title: 목차
      body: '레일이 선택하고, 중앙이 보여주며, 검사자가 어떤 것을 선택하고 넘어갑니다.'
    figures:
      title: 도형
      body: '이 슬라이드는 서버에 의해 렌더링되고 임베드에 로드되었습니다.'
    closing:
      title: 마무리
      body: '세 가지 영역, 하나의 채널, 그리고 그들 서로는 서로를 알지 못합니다.'

bn:
  page_title: স্লাইড
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: কভার
      body: 'চারটি স্লাইডের একটি ডেক, একটি কর্মক্ষেত্র প্রদর্শন করতে এবং একটি উপস্থাপনাকে নয়।'
    agenda:
      title: এজেন্ডা
      body: 'রেলটি নির্বাচন করে, কেন্দ্রটি প্রদর্শন করে, পরিদর্শক বলে কোনটি এবং পরবর্তী দিকে চলে।'
    figures:
      title: ফিগার
      body: 'এই স্লাইডটি সার্ভার দ্বারা রেন্ডার করা হয়েছে এবং একটি এম্বেডে লোড করা হয়েছে।'
    closing:
      title: সমাপ্তি
      body: 'তিনটি অঞ্চল, একটি চ্যানেল, এবং তাদের মধ্যে কেউ অন্যদের জানে না।'

th:
  page_title: สไลด์
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: หน้าปก
      body: 'ชุดสไลด์สี่ชุด เพื่อแสดงสถานที่ทำงานและไม่ใช่การนำเสนอ.'
    agenda:
      title: วาระ
      body: 'รางเลือก, ศูนย์แสดง, ผู้ตรวจสอบบอกว่าสไลด์ไหนและดำเนินการต่อ.'
    figures:
      title: ตัวเลข
      body: สไลด์นี้ถูกเรนเดอร์โดยเซิร์ฟเวอร์และโหลดเข้าไปในแทรก.
    closing:
      title: ปิดการนำเสนอ
      body: 'สามภูมิภาค, ช่องทางเดียว, และไม่มีใครรู้จักกันเลย.'

de:
  page_title: Folie
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Titelseite
      body: 'Ein Deck aus vier Folien, um einen Arbeitsbereich und keine Präsentation zu zeigen.'
    agenda:
      title: Agenda
      body: 'Die Schiene wählt, das Zentrum zeigt, der Prüfer sagt, welche und macht weiter.'
    figures:
      title: Zahlen
      body: 'Diese Folie wurde vom Server gerendert und in ein Embed geladen.'
    closing:
      title: Abschluss
      body: 'Drei Regionen, ein Kanal, und keine von ihnen kennt die anderen.'

fi:
  page_title: Dia
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Kansi
      body: 'Neljä dian esityspakettia, jotka esittävät työtilan eikä esitystä.'
    agenda:
      title: Aikataulu
      body: 'Raide valitsee, keskus näyttää, tarkastaja sanoo kumpi ja siirtyy eteenpäin.'
    figures:
      title: Luvut
      body: 'Tämä dia renderöitiin palvelimella ja ladattiin upotettuna.'
    closing:
      title: Päätös
      body: 'Kolme aluetta, yksi kanava, eikä yksikään niistä tiedä toisten olemassaolosta.'

ru:
  page_title: Слайд
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Обложка
      body: 'Набор из четырёх слайдов, чтобы показать рабочее пространство, а не презентацию.'
    agenda:
      title: Повестка
      body: 'Рельс выбирает, центр показывает, инспектор говорит, какой из них и продолжает.'
    figures:
      title: Фигуры
      body: 'Этот слайд был отрендерен сервером и загружен в встраивание.'
    closing:
      title: Заключение
      body: 'Три региона, один канал, и ни один из них не знает о других.'

pl:
  page_title: Slajd
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Okładka
