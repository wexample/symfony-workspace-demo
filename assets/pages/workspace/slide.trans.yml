    agenda:
      title: Agenda
      body: 'Szyna wybiera, środek pokazuje, inspektor mówi, który i przechodzi dalej.'
    figures:
      title: Liczby
      body: 'Ten slajd został wygenerowany przez serwer i załadowany do osadzenia.'
    closing:
      title: Zamknięcie
      body: 'Trzy obszary, jeden kanał, a żaden z nich nie zna pozostałych.'

es:
  page_title: Diapositiva
  page_icon: 'ph:bold/presentation'
