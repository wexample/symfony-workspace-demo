    agenda:
      title: Gündem
      body: 'Ray seçer, merkez gösterir, denetçi hangisinin olduğunu söyler ve devam eder.'
    figures:
      title: Şekiller
      body: 'Bu slayt sunucu tarafından oluşturuldu ve bir yerleştirmeye yüklendi.'
    closing:
      title: Kapanış
      body: 'Üç bölge, bir kanal ve hiçbiri diğerlerini tanımıyor.'

vi:
  page_title: 'Trang trình bày'
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Bìa
      body: 'Một bộ bốn trang trình bày, để cho thấy một không gian làm việc chứ không phải một bài thuyết trình.'
    agenda:
      title: 'Chương trình'
      body: 'Đường ray chọn, trung tâm hiển thị, thanh tra chỉ ra cái nào và tiếp tục.'
    figures:
      title: 'Hình ảnh'
      body: 'Trang trình bày này được máy chủ tạo ra và tải vào một phần nhúng.'
    closing:
      title: 'Kết thúc'
      body: 'Ba khu vực, một kênh, và không ai trong số họ biết về những người khác.'

id:
  page_title: Slide
  page_icon: 'ph:bold/presentation'
  position: '%position% / %count%'
  slide:
    cover:
      title: Sampul
      body: 'Sekumpulan empat slide, untuk menunjukkan ruang kerja dan bukan presentasi.'
    agenda:
      title: Agenda
      body: 'Rel memilih, pusat menunjukkan, inspektur mengatakan yang mana dan melanjutkan.'
