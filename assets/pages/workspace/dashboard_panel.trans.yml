en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Dashboard panel
  page_icon: ph:bold/square-half

  field:
    version: Version
    instances: Instances
    loaded: Loaded

  loaded:
    at_once: as soon as the page was shown
    late: "%seconds% s late, on purpose"

  service:
