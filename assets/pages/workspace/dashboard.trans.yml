      description: 'ہر ٹائل ایک منزل کا نام رکھتا ہے، `zone--min-*`: اس کے نیچے ٹائل کو سکیڑا نہیں جاتا، فریم اس کے بجائے سکرول کرتا ہے — افقی اور عمودی دونوں۔'
    errors:
      title: غلطیاں
      figure: '2.1 %'
      description: 'پیمائش کی گئی، ایک زون اپنی تقسیم کی محور کے ساتھ چھوڑے گئے سائز کو برقرار رکھتا ہے، اور اسی کے ساتھ واپس آتا ہے؛ ہینڈل پر دو بار کلک کرنے سے یہ دوبارہ تقسیم میں واپس آ جاتا ہے۔'
    queue:
      title: قطار
      figure: '318 ملازمتیں'
      description: '`zone--split--flush` خلا کو ایک پکسل تک تنگ کرتا ہے، دیوار کا زمین ٹائلز کے درمیان لائن کھینچتا ہے۔ دیوار پر ایک کلاس کافی ہے، قطاریں اسے وراثت میں لیتی ہیں۔'
    deploys:
      title: تعیناتیں
      figure: 'آج 7'
      description: 'اس کے بغیر وہی دیوار اپنے ٹائلز کے درمیان جگہ کو برقرار رکھتی ہے، جس کے ذریعے صفحے کا زمین ظاہر ہوتا ہے — اوپر کی بار میں سوئچ کریں۔ صرف ایک بار نظر آنے پر لوڈ ہونے والے پینل کے لیے دائیں سکرول کریں۔'

