en:
  ~extends: "@WexampleSymfonyLoaderBundle.config.design_system.app.index"

  page_title: Dashboard
  page_icon: ph:bold/squares-four

  mode:
    reopen: Reopen the API panel
    gap: With gaps
    flush: Flush

  state:
    success: Nominal
    warning: Degraded
    error: Failing
    running: Draining

  tile:
    traffic:
      title: Traffic
      figure: 12.4k req/min
      description: "Splits inside a split: the wall is a vertical split of rows, each row a split of its own. Drag the edge under this row to give it more height, or the one beside this tile for more width."
    latency:
      title: Latency p95
      figure: 184 ms
      description: "Every tile names a floor, `zone--min-*`: below it the tile is not squeezed, the frame scrolls instead — sideways as well as down."
    errors:
      title: Errors
      figure: 2.1 %
      description: "Resized, a zone keeps the size it was left at along its split's axis, and comes back with it; a double click on the handle gives it back to the split."
    queue:
      title: Queue
      figure: 318 jobs
      description: "`zone--split--flush` narrows the gap to a pixel, the wall's ground drawing the line between tiles. One class on the wall is enough, the rows inherit it."
    deploys:
      title: Deployments
      figure: 7 today
      description: "Without it the same wall keeps the room between its tiles, through which the page's ground shows — switch in the bar above. Scroll right for a panel loaded only once it is seen."

ar:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'لوحة التحكم'
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'إعادة فتح لوحة واجهة برمجة التطبيقات'
    gap: 'مع فراغات'
    flush: تفريغ
  state:
    success: طبيعي
    warning: متدهور
    error: فاشل
    running: تفريغ
  tile:
    traffic:
      title: 'حركة المرور'
      figure: '12.4 ألف طلب/دقيقة'
      description: 'ت splits داخل split: الحائط هو split عمودي من الصفوف، كل صف هو split خاص به. اسحب الحافة أسفل هذا الصف لمنحه مزيدًا من الارتفاع، أو تلك بجانب هذه البلاطة لمزيد من العرض.'
    latency:
      title: 'الكمون p95'
      figure: '184 مللي ثانية'
      description: 'كل بلاطة تسمي طابقًا، `zone--min-*`: أسفلها لا تضغط البلاطة، الإطار يتدحرج بدلاً من ذلك - جانبيًا وكذلك للأسفل.'
    errors:
      title: الأخطاء
      figure: '2.1 %'
      description: 'عند تغيير الحجم، يحتفظ المنطقة بالحجم الذي تركت عنده على محور تقسيمها، وتعود معه؛ نقرة مزدوجة على المقبض تعيدها إلى التقسيم.'
    queue:
      title: 'قائمة الانتظار'
      figure: '318 وظيفة'
      description: '`zone--split--flush` يضيق الفجوة إلى بكسل، الرسم الأرضي للحائط يرسم الخط بين البلاطات. فئة واحدة على الحائط تكفي، الصفوف ترثها.'
    deploys:
      title: نشر
      figure: '7 اليوم'
      description: 'بدونها، يحتفظ نفس الحائط بالغرفة بين بلاطاته، من خلالها يظهر الرسم الأرضي للصفحة - التبديل في الشريط أعلاه. قم بالتمرير لليمين لفتح لوحة محملة فقط عندما تُرى.'

bn:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: ড্যাশবোর্ড
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'এপিআই প্যানেল পুনরায় খুলুন'
    gap: 'ফাঁক সহ'
    flush: ফ্লাশ
  state:
    success: স্বাভাবিক
    warning: অবনমিত
    error: বিফলিত
    running: ড্রেইনিং
  tile:
    traffic:
      title: ট্রাফিক
      figure: '১২.৪ক req/মিনিট'
      description: 'একটি বিভাজনের মধ্যে বিভাজন: প্রাচীরটি সারির একটি উল্লম্ব বিভাজন, প্রতিটি সারি নিজস্ব একটি বিভাজন। এই সারির নিচের প্রান্ত টেনে তার উচ্চতা বাড়ান, অথবা এই টাইলের পাশে আরও প্রস্থের জন্য।'
    latency:
      title: 'লেটেন্সি p95'
      figure: '১৮৪ ms'
      description: 'প্রতিটি টাইল একটি ফ্লোরের নাম দেয়, `zone--min-*`: এর নিচে টাইলটি সংকুচিত নয়, ফ্রেমটি পরিবর্তে স্ক্রোল হয় — পাশের পাশাপাশি নিচে।'
    errors:
      title: ত্রুটি
      figure: '2.1 %'
      description: 'আকার পরিবর্তন করলে, একটি জোন তার বিভাজনের অক্ষ বরাবর যে আকারে ছিল সেটি ধরে রাখে এবং সাথে ফিরে আসে; হ্যান্ডেলের উপর ডাবল ক্লিক করলে এটি বিভাজনে ফিরে আসে।'
    queue:
      title: কিউ
      figure: '৩১৮ চাকরি'
      description: '`zone--split--flush` ফাঁককে একটি পিক্সেলে সংকীর্ণ করে, প্রাচীরের নিচের অংশ টাইলের মধ্যে রেখা আঁকে। প্রাচীরের উপর একটি ক্লাস যথেষ্ট, সারিগুলি এটি উত্তরাধিকারী করে।'
    deploys:
      title: ডিপ্লয়মেন্ট
      figure: 'আজ ৭'
      description: 'এর ছাড়া একই প্রাচীর তার টাইলের মধ্যে ঘর ধরে রাখে, যার মাধ্যমে পৃষ্ঠার নিচের অংশ প্রদর্শিত হয় — উপরের বারটিতে স্যুইচ করুন। একটি প্যানেল শুধুমাত্র দেখা হলে একবার লোড হয়, ডান দিকে স্ক্রোল করুন।'

de:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Dashboard
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'API-Panel wieder öffnen'
    gap: 'Mit Lücken'
    flush: Leeren
  state:
    success: Nominal
    warning: Degradiert
    error: Fehlerhaft
    running: Entleeren
  tile:
    traffic:
      title: Verkehr
      figure: '12,4k Anfragen/min'
      description: 'Splits innerhalb eines Splits: die Wand ist ein vertikaler Split von Zeilen, jede Zeile ist ein eigener Split. Ziehen Sie die Kante unter dieser Zeile, um ihr mehr Höhe zu geben, oder die neben diesem Kachel für mehr Breite.'
    latency:
      title: 'Latenz p95'
      figure: '184 ms'
      description: 'Jede Kachel bezeichnet einen Boden, `zone--min-*`: darunter wird die Kachel nicht gedrückt, der Rahmen scrollt stattdessen — seitlich sowie nach unten.'
    errors:
      title: Fehler
      figure: '2.1 %'
      description: 'Verkleinert behält eine Zone die Größe, auf der sie entlang der Achse des Splits verlassen wurde, und kommt mit ihr zurück; ein Doppelklick auf den Griff gibt sie zurück an den Split.'
    queue:
      title: Warteschlange
      figure: '318 Aufgaben'
      description: '`zone--split--flush` verengt die Lücke auf einen Pixel, die Grundlinie der Wand zieht die Linie zwischen den Kacheln. Eine Klasse an der Wand reicht aus, die Zeilen erben sie.'
    deploys:
      title: Bereitstellungen
      figure: '7 heute'
      description: 'Ohne sie hält die gleiche Wand den Raum zwischen ihren Kacheln, durch den der Boden der Seite sichtbar wird — wechseln Sie in der Leiste oben. Scrollen Sie nach rechts für ein Panel, das nur geladen wird, wenn es gesehen wird.'

es:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Tablero
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'Reabrir el panel API'
    gap: 'Con espacios'
    flush: Desaguar
  state:
    success: Nominal
    warning: Degradado
    error: Fallando
    running: Drenando
  tile:
    traffic:
      title: Tráfico
      figure: '12.4k req/min'
      description: 'Divisiones dentro de una división: la pared es una división vertical de filas, cada fila es una división propia. Arrastra el borde debajo de esta fila para darle más altura, o el de al lado de este azulejo para más ancho.'
    latency:
      title: 'Latencia p95'
      figure: '184 ms'
      description: 'Cada azulejo nombra un piso, `zone--min-*`: por debajo no se comprime, el marco se desplaza en su lugar — lateralmente así como hacia abajo.'
    errors:
      title: Errores
      figure: '2.1 %'
      description: 'Redimensionado, una zona mantiene el tamaño que se le dejó a lo largo de su eje de división, y regresa con él; un doble clic en el mango lo devuelve a la división.'
    queue:
      title: Cola
      figure: '318 trabajos'
      description: '`zone--split--flush` reduce el espacio a un píxel, la base de la pared dibuja la línea entre los azulejos. Una clase en la pared es suficiente, las filas la heredan.'
    deploys:
      title: Despliegues
      figure: '7 hoy'
      description: 'Sin esto, la misma pared mantiene el espacio entre sus azulejos, a través del cual se muestra el fondo de la página — cambia en la barra de arriba. Desplázate a la derecha para un panel cargado solo una vez que se vea.'

fa:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: داشبورد
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'پنل API را دوباره باز کنید'
    gap: 'با شکاف‌ها'
    flush: 'خالی کردن'
  state:
    success: نرمال
    warning: 'کاهش عملکرد'
    error: 'در حال شکست'
    running: 'در حال تخلیه'
  tile:
    traffic:
      title: ترافیک
      figure: '۱۲.۴k درخواست/دقیقه'
      description: 'شکاف‌ها درون یک شکاف: دیوار یک شکاف عمودی از ردیف‌ها است، هر ردیف شکاف خود را دارد. لبه زیر این ردیف را بکشید تا ارتفاع بیشتری بگیرد، یا لبه کنار این کاشی را برای عرض بیشتر.'
    latency:
      title: 'تاخیر p95'
      figure: '۱۸۴ میلی‌ثانیه'
      description: 'هر کاشی یک طبقه را نامگذاری می‌کند، `zone--min-*`: در زیر آن کاشی فشرده نمی‌شود، به جای آن فریم به طرفین و پایین حرکت می‌کند.'
    errors:
      title: خطاها
      figure: '2.1 %'
      description: 'با تغییر اندازه، یک ناحیه اندازه‌ای را که در محور شکاف خود رها شده حفظ می‌کند و با آن باز می‌گردد؛ دو بار کلیک بر روی دستگیره آن را به شکاف برمی‌گرداند.'
    queue:
      title: صف
      figure: '۳۱۸ کار'
      description: '`zone--split--flush` فاصله را به یک پیکسل تنگ می‌کند، زمین دیوار خطی را بین کاشی‌ها ترسیم می‌کند. یک کلاس روی دیوار کافی است، ردیف‌ها آن را به ارث می‌برند.'
    deploys:
      title: استقرارها
      figure: '۷ امروز'
      description: 'بدون آن، همان دیوار فضای بین کاشی‌های خود را حفظ می‌کند، که از طریق آن زمین صفحه نمایش داده می‌شود — در نوار بالایی سوئیچ کنید. به سمت راست اسکرول کنید تا پنلی بارگذاری شود که تنها زمانی دیده می‌شود.'

fi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: Ohjauspaneeli
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'Avaa API-paneeli uudelleen'
    gap: 'Väliin jääviä'
    flush: Tyhjennä
  state:
    success: Normaali
    warning: Heikentynyt
    error: Epäonnistunut
    running: Tyhjennetään
  tile:
    traffic:
      title: Liikenne
      figure: '12.4k req/min'
      description: 'Jakautuu jakoon: seinä on pystysuora jakso riveistä, jokainen rivi on oma jakonsa. Vedä tämän rivin alapuolella olevaa reunaa lisäämään korkeutta, tai viereistä reunaa lisäämään leveyttä.'
    latency:
      title: 'Viive p95'
      figure: '184 ms'
      description: 'Jokainen laatikko nimetään kerrokseksi, `zone--min-*`: sen alapuolella laatikkoa ei puristeta, kehys vierittää sen sijaan - sivuttain sekä alas.'
    errors:
      title: Virheet
      figure: '2.1 %'
      description: 'Koon muuttuessa vyöhyke säilyttää koon, johon se jäi jakson akselinsa mukaan, ja palaa siihen; kaksoisklikkaus kahvasta palauttaa sen jakoon.'
    queue:
      title: Jonot
      figure: '318 työtehtävää'
      description: '`zone--split--flush` kaventaa välin pikseliksi, seinän pohja piirtää viivan laatikoiden väliin. Yksi luokka seinällä riittää, rivit perivät sen.'
    deploys:
      title: Käyttöönottot
      figure: '7 tänään'
      description: 'Ilman sitä sama seinä pitää tilan laatikoiden välissä, jonka läpi sivun pohja näkyy - vaihda ylhäällä olevasta palkista. Vieritä oikealle saadaksesi paneelin, joka latautuu vain kun se näkyy.'

fr:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: 'Tableau de bord'
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'Rouvrir le panneau API'
    gap: 'Avec des espaces'
    flush: Flush
  state:
    success: Nominal
    warning: Dégradé
    error: Échec
    running: Vidange
  tile:
    traffic:
      title: Trafic
      figure: '12,4 k req/min'
      description: "Les divisions à l'intérieur d'une division : le mur est une division verticale de lignes, chaque ligne ayant sa propre division. Faites glisser le bord sous cette ligne pour lui donner plus de hauteur, ou celui à côté de ce carrelage pour plus de largeur."
    latency:
      title: 'Latence p95'
      figure: '184 ms'
      description: "Chaque carrelage nomme un étage, `zone--min-*` : en dessous, le carrelage n'est pas comprimé, le cadre défile à la place — latéralement ainsi que vers le bas."
    errors:
      title: Erreurs
      figure: '2.1 %'
      description: "Redimensionné, une zone conserve la taille à laquelle elle a été laissée le long de l'axe de sa division, et revient avec elle ; un double clic sur la poignée la ramène à la division."
    queue:
      title: "File d'attente"
      figure: '318 emplois'
      description: "`zone--split--flush` réduit l'écart à un pixel, le sol du mur traçant la ligne entre les tuiles. Une classe sur le mur suffit, les rangées l'héritent."
    deploys:
      title: Déploiements
      figure: "7 aujourd'hui"
      description: "Sans cela, le même mur garde l'espace entre ses tuiles, à travers lequel le sol de la page se montre — changez dans la barre au-dessus. Faites défiler vers la droite pour un panneau chargé uniquement lorsqu'il est vu."

he:
