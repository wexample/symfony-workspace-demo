  state:
    success: נורמלי
    warning: מופחת
    error: כושל
    running: מתנקז
  tile:
    traffic:
      title: תעבורה
      figure: '12.4k req/min'
      description: 'חלוקות בתוך חלוקה: הקיר הוא חלוקה אנכית של שורות, כל שורה חלוקה בפני עצמה. גרור את הקצה מתחת לשורה זו כדי לתת לה יותר גובה, או את זה לצד האריח הזה כדי להרחיב אותה.'
    latency:
      title: 'ליטוי p95'
      figure: '184 ms'
      description: 'כל אריח שמו קומה, `zone--min-*`: מתחתיו האריח לא נדחס, המסגרת גוללת במקום זאת — מצד לצד וגם למטה.'
    errors:
      title: שגיאות
      figure: '2.1 %'
      description: 'כאשר הוא שונה גודל, אזור שומר על הגודל שבו עזבנו אותו לאורך ציר החלוקה שלו, וחוזר עם זה; קליק כפול על הידית מחזיר אותו לחלוקה.'
    queue:
      title: תור
      figure: '318 עבודות'
      description: '`zone--split--flush` מצמצם את הפער לפיקסל, הקו שעל הקיר מושך את הגבול בין האריחים. מספיק שהמחלקה על הקיר תהיה אחת, השורות ירשו אותה.'
    deploys:
      title: הפצות
      figure: '7 היום'
      description: 'ללא זה, אותו קיר שומר על החלל בין האריחים שלו, דרכו מראה הקרקע של הדף — החלף בסרגל למעלה. גלול ימינה עבור פאנל שמטען רק לאחר שנראה.'

hi:
  ~extends: '@WexampleSymfonyLoaderBundle.config.design_system.app.index'
  page_title: डैशबोर्ड
  page_icon: 'ph:bold/squares-four'
  mode:
    reopen: 'API पैनल फिर से खोलें'
    gap: 'गैप के साथ'
    flush: फ्लश
  state:
    success: सामान्य
    warning: कमजोर
    error: फेल
    running: ड्रेनिंग
  tile:
    traffic:
      title: ट्रैफिक
      figure: '12.4k req/min'
      description: 'एक स्प्लिट के अंदर स्प्लिट: दीवार पंक्तियों का एक ऊर्ध्वाधर स्प्लिट है, प्रत्येक पंक्ति का अपना स्प्लिट होता है। इस पंक्ति के नीचे के किनारे को खींचें ताकि इसे अधिक ऊँचाई मिले, या इस टाइल के बगल वाले को अधिक चौड़ाई के लिए।'
    latency:
      title: 'लेटेंसी p95'
      figure: '184 ms'
      description: 'हर टाइल एक मंजिल का नाम देती है, `zone--min-*`: इसके नीचे टाइल को निचोड़ नहीं किया जाता है, फ्रेम इसके बजाय स्क्रॉल करता है - साइडवेज और नीचे दोनों।'
    errors:
      title: गलतियाँ
      figure: '2.1 %'
      description: 'पुनः आकार में, एक ज़ोन अपनी स्प्लिट के अक्ष के साथ जिस आकार पर छोड़ा गया था, उसे बनाए रखता है, और इसके साथ वापस आता है; हैंडल पर डबल क्लिक इसे स्प्लिट पर वापस ले आता है।'
    queue:
      title: क्यू
      figure: '318 नौकरियां'
      description: '`zone--split--flush` गैप को एक पिक्सेल तक संकीर्ण करता है, दीवार की ज़मीन टाइलों के बीच की रेखा खींचती है। दीवार पर एक वर्ग पर्याप्त है, पंक्तियाँ इसे विरासत में लेती हैं।'
    deploys:
